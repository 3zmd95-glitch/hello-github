name: Deploy Scout Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/scout/**"
      - "planning/data/saudi-events.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secrets can't be read in a job-level `if`, so the first step checks them and every later deploy
      # step is conditioned on its output. Until the owner adds the Cloudflare secrets the run stays green.
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scout Worker not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (see workers/scout/README.md)."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Worker
        run: pnpm --filter 3z-scout run test

      # The social connector stores tokens and daily rows in a KV namespace. Wrangler titles it
      # "3z-scout-SOCIAL_KV" (older versions) or "SOCIAL_KV" (4.x). Create it once, then put its id in place of the
      # placeholder in wrangler.jsonc (only in this checkout; the committed file keeps the placeholder).
      - name: Ensure the SOCIAL_KV namespace
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_TITLE: 3z-scout-SOCIAL_KV
        run: |
          set -euo pipefail
          find_id() {
            pnpm --filter 3z-scout exec wrangler kv namespace list | node -e '
              let s = "";
              process.stdin.on("data", (c) => (s += c)).on("end", () => {
                const start = s.indexOf("["), end = s.lastIndexOf("]");
                const list = start >= 0 ? JSON.parse(s.slice(start, end + 1)) : [];
                // Older wrangler titles it "<worker>-<binding>", wrangler 4.x just "<binding>"; accept both.
                const hit = list.find((n) => n.title === process.env.KV_TITLE || n.title === "SOCIAL_KV");
                process.stdout.write(hit ? hit.id : "");
              });'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Creating KV namespace $KV_TITLE"
            pnpm --filter 3z-scout exec wrangler kv namespace create SOCIAL_KV
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then
            echo "::error title=SOCIAL_KV::Could not find or create the KV namespace $KV_TITLE"
            exit 1
          fi
          echo "SOCIAL_KV id: $ID"
          KV_ID="$ID" node -e '
            const fs = require("fs");
            const path = "workers/scout/wrangler.jsonc";
            const src = fs.readFileSync(path, "utf8");
            const out = src.replace(/("binding":\s*"SOCIAL_KV",\s*"id":\s*")[0-9a-f]+(")/, `$1${process.env.KV_ID}$2`);
            if (out === src) { console.error("placeholder not found in " + path); process.exit(1); }
            fs.writeFileSync(path, out);'
          grep -n '"SOCIAL_KV"' workers/scout/wrangler.jsonc

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter 3z-scout exec wrangler deploy

      - name: Set TAVILY_API_KEY
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::notice title=TAVILY_API_KEY not set::Add the TAVILY_API_KEY repository secret so /search works."
            exit 0
          fi
          echo "$TAVILY_API_KEY" | pnpm --filter 3z-scout exec wrangler secret put TAVILY_API_KEY

      - name: Set SCOUT_TOKEN
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_TOKEN }}
        run: |
          if [ -z "$SCOUT_TOKEN" ]; then
            echo "::notice title=SCOUT_TOKEN not set::Add the SCOUT_TOKEN repository secret; until then the Worker rejects every search."
            exit 0
          fi
          echo "$SCOUT_TOKEN" | pnpm --filter 3z-scout exec wrangler secret put SCOUT_TOKEN

      # Social connector credentials (Instagram + Threads share the Meta app) and the Trend Radar's YouTube
      # API key. Each one is optional: a platform without both halves shows `configured: false` in the
      # dashboard, the radar's YouTube sources report `not_configured` without the key, and nothing else breaks.
      - name: Set social API secrets
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          for NAME in META_APP_ID META_APP_SECRET THREADS_APP_ID THREADS_APP_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET YOUTUBE_API_KEY; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              if [ "$NAME" = "YOUTUBE_API_KEY" ]; then
                echo "::notice title=YOUTUBE_API_KEY not set::Add the YOUTUBE_API_KEY repository secret (a Google Cloud API key restricted to the YouTube Data API v3) so the Trend Radar's YouTube charts and keyword search work (see planning/tools/08-trends.md)."
              else
                echo "::notice title=$NAME not set::Add the $NAME repository secret to connect that platform (see planning/tools/06-social-analytics-apis.md)."
              fi
              continue
            fi
            printf '%s' "$VALUE" | pnpm --filter 3z-scout exec wrangler secret put "$NAME"
          done
