<title>3z Prod HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0f1824; --bg-dot:#1b2838; --surface:#182534; --surface-2:#213246; --surface-3:#2a3d55;
  --edge:#070c12; --ink:#f6f1e3; --ink-2:#c3cedb; --muted:#8397ad;
  --green:#5ee39a; --green-d:#2fa56a; --gold:#ffcc4d; --gold-d:#c9912a; --sky:#6cc6ff; --pink:#ff8fb3; --purple:#a57bff; --red:#ff6b5e; --orange:#ff9d4d;
  --body:"Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pixel:"Pixelify Sans","Baloo Bhaijaan 2",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.px{font-family:var(--pixel);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:800}
h1{font-size:1.7rem} h2{font-size:1.1rem} h3{font-size:.98rem;font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:.82rem}

/* pixel box */
.box{background:var(--surface);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.inset{background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:10px 12px}
.pbtn{border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);background:var(--green);color:#08140d;font-weight:800;padding:6px 14px;border-radius:3px;font-size:.9rem;transition:transform .08s,box-shadow .08s}
.pbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.pbtn.gold{background:var(--gold)} .pbtn.sky{background:var(--sky)} .pbtn.pink{background:var(--pink)}
.pbtn.ghost{background:var(--surface-2);color:var(--ink)}
.pbtn:disabled{opacity:.45;cursor:default;transform:none}
.pbar{height:16px;background:var(--edge);border:2px solid var(--edge);border-radius:2px;position:relative;overflow:hidden}
.pbar i{position:absolute;inset-block:0;inset-inline-start:0;background:
  repeating-linear-gradient(90deg,var(--c,var(--green)) 0 10px,color-mix(in srgb,var(--c,var(--green)) 82%,#fff) 10px 12px);transition:width .5s steps(8)}
.pbar.sm{height:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 8px;border:2px solid var(--edge);border-radius:3px;background:var(--surface-3);white-space:nowrap}
.chip.t1{background:#1f4a36;color:#aef3cc}.chip.t2{background:#5a4417;color:#ffe08f}.chip.t3{background:#5a2029;color:#ffb3aa}
.chip.q{background:var(--green);color:#08140d}
.chip.gold{background:var(--gold);color:#2a1d00}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* app shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-inline-end:3px solid var(--edge);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;background:var(--green);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);display:grid;place-items:center;font-family:var(--pixel);font-weight:700;color:#08140d;border-radius:3px}
.brand b{display:block;font-size:1.02rem;font-weight:800}
.brand small{color:var(--muted);font-size:.74rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border:2px solid transparent;background:none;border-radius:3px;color:var(--ink-2);text-align:start;font-size:.95rem;font-weight:600}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--surface-2);border-color:var(--edge);color:var(--gold);box-shadow:3px 3px 0 var(--edge)}
.nav .ico{width:22px;text-align:center;font-family:var(--pixel)}
.wallet{display:flex;gap:8px;flex-wrap:wrap}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:3px 8px;font-size:.9rem}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mock{font-size:.72rem;color:#2a1d00;background:var(--gold);border:2px solid var(--edge);border-radius:3px;padding:2px 8px;align-self:flex-start;font-weight:600}
.lang{display:flex;border:2px solid var(--edge);border-radius:3px;background:var(--edge);gap:2px;align-self:flex-start}
.lang button{border:0;background:var(--surface-2);padding:3px 12px;font-size:.82rem;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#2a1d00;font-weight:800}

main{padding-block:24px 48px;padding-inline:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top-mobile{display:none}
.head p{margin:2px 0 0;color:var(--ink-2)}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.3fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}

/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:14px}
.stage{background:linear-gradient(#26405e,#1b2d43);border:3px solid var(--edge);border-radius:3px;padding:10px 14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stage{--floor:repeating-linear-gradient(90deg,#3b6b4a 0 8px,#2f5a3d 8px 16px)}
.stage::after{content:"";display:block;width:100%;height:10px;background:var(--floor);border-top:2px solid var(--edge)}
.stage.s-light{background:radial-gradient(circle at 12% 45%,rgba(255,221,140,.35),transparent 55%),linear-gradient(#26405e,#1b2d43)}
.stage.s-set{background:radial-gradient(circle at 12% 45%,rgba(255,221,140,.3),transparent 55%),linear-gradient(#22222c,#121218);--floor:repeating-linear-gradient(90deg,#3a3036 0 8px,#2b2328 8px 16px)}
.stage.s-gold{--floor:repeating-linear-gradient(90deg,#c9912a 0 8px,#ffcc4d 8px 16px)}
.stage.s-aura{animation:aura 2s steps(4) infinite}
@keyframes aura{50%{box-shadow:0 0 0 3px #ffcc4d,0 0 26px rgba(255,204,77,.55)}}
.stage.s-cosmic{background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/14px 14px,radial-gradient(circle at 50% 40%,#5a3aa0,transparent 70%),linear-gradient(#1c1238,#0c0820)}
.stage.s-legend{background:radial-gradient(#fff6 1px,transparent 1.5px) 0 0/14px 14px,radial-gradient(circle at 50% 35%,#ffcc4d88,transparent 65%),linear-gradient(#3a2a08,#1a1204)}
.evo{display:flex;flex-direction:column;gap:4px;width:100%}
.evo input{width:100%;accent-color:var(--gold)}
.rk .stage{padding:0;align-self:stretch}
.stage.scene{padding:0;background:#070c12;align-self:stretch;display:flex;justify-content:center}
.stage.scene::after{display:none}
.stage canvas{max-width:100%;height:auto}
.rank{font-weight:800;color:var(--gold);font-size:1.25rem}
.lv{font-family:var(--pixel);font-size:.95rem;background:var(--edge);color:var(--green);padding:1px 8px;border-radius:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:2px solid var(--edge);background:var(--surface-2);border-radius:3px;padding:2px 8px;font-size:.76rem;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--sky);color:#04192a;font-weight:800}
.opt.locked{opacity:.6}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.stat b{font-family:var(--pixel);font-size:1.2rem;display:block;line-height:1}
.stat small{color:var(--muted);font-size:.72rem;display:block}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;max-width:100%;border:2px solid var(--edge);border-radius:3px;background:var(--surface-2);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.day.on{background:var(--orange);color:#2a1100;font-weight:800}
.day.fz{background:var(--sky);color:#04192a}
.day.today{outline:2px dashed var(--gold);outline-offset:1px}
.micro{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{border:2px dashed var(--muted);background:none;border-radius:3px;padding:3px 10px;font-size:.82rem;color:var(--ink-2)}
.mbtn:hover{border-color:var(--gold);color:var(--gold)}
.mbtn.done{border-style:solid;border-color:var(--edge);background:var(--orange);color:#2a1100;font-weight:600}

.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:10px 12px}
.check{width:30px;height:30px;border:3px solid var(--edge);background:var(--surface);border-radius:3px;display:grid;place-items:center;font-family:var(--pixel);font-size:1rem;color:transparent;box-shadow:2px 2px 0 var(--edge)}
.check.on{background:var(--green);color:#08140d}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.qpath{font-size:.74rem;color:var(--muted)}
.qwhy{font-size:.78rem;color:var(--ink-2)}
.reward-x{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.xp{font-family:var(--pixel);color:var(--green);font-size:.86rem;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.gm{font-family:var(--pixel);color:var(--sky);font-size:.78rem;direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.focus{display:flex;align-items:center;gap:12px}
.timer{font-family:var(--pixel);font-size:1.7rem;color:var(--green);direction:ltr}
.boost{background:var(--green);color:#08140d;border:2px solid var(--edge);border-radius:3px;font-size:.72rem;font-weight:800;padding:0 6px}
.chestbox{display:flex;align-items:center;gap:12px}
.chestbox.ready canvas{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.boss{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.boss canvas{animation:bob 1.6s steps(2) infinite}
.hit canvas{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}

/* map */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px;position:relative}
.region{background:var(--surface);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.region.done{background:linear-gradient(var(--surface),#2d2a17)}
.region .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.region .rn{font-weight:800}
.stepno{font-family:var(--pixel);background:var(--edge);color:var(--gold);border-radius:2px;padding:0 6px;font-size:.8rem}
.nodes{display:flex;gap:10px;flex-wrap:wrap}
.node{width:46px;height:46px;border:3px solid var(--edge);border-radius:4px;background:var(--surface-3);box-shadow:3px 3px 0 var(--edge);display:grid;place-items:center;font-family:var(--pixel);font-size:.8rem;position:relative;padding:0}
.node .fill{position:absolute;inset-inline:0;bottom:0;background:var(--green);opacity:.85}
.node span{position:relative;z-index:1;color:var(--ink);text-shadow:1px 1px 0 var(--edge)}
.node.m{background:var(--gold)} .node.m span{color:#2a1d00;text-shadow:none}
.node.idea{background:none;border-style:dashed}
.node[aria-pressed="true"],.nodeb[aria-pressed="true"] .node{outline:3px solid var(--pink);outline-offset:2px}
.nodeb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;color:var(--ink);cursor:pointer}
.nodeb .node{transition:transform .1s steps(2)}
.nodeb:hover .node,.nodeb:focus-visible .node{transform:translateY(-3px);box-shadow:3px 6px 0 var(--edge)}
.nodeb:active .node{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.nlab{font-size:.68rem;line-height:1.25;text-align:center;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.nodes{align-items:flex-start}
.skpop{position:fixed;inset:0;background:rgba(7,12,18,.6);display:grid;place-items:center;z-index:45;padding:16px}
.skbox{max-width:600px;width:100%;max-height:88vh;overflow:auto;align-items:stretch;text-align:start}.skbox.anim{animation:popin .25s steps(4) both}
.skbox .detail{grid-template-columns:1fr}
.maphint{text-align:center;padding:4px}
@media (max-width:620px){.skpop{place-items:end stretch;padding:0}.skbox{border-radius:12px 12px 0 0;max-height:86vh}.skbox.anim{animation:sheetup .25s steps(4)}}
.node.add{background:none;border-style:dashed;color:var(--muted);box-shadow:none;font-size:1.1rem}
.sea{background-color:#17466f;background-image:radial-gradient(#2a6aa0 1.5px,transparent 1.6px),radial-gradient(#215b8c 1px,transparent 1.2px);background-size:18px 12px,11px 17px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);border-radius:4px;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px;align-items:start}
.isle{background:none;border:2px solid transparent;border-radius:4px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);text-align:center}
.isle:hover{background:rgba(7,12,18,.25);border-color:var(--acc)}
.isle:nth-child(even){transform:translateY(16px)}
.isle.home{grid-column:span 2;grid-row:span 2}
.isle b{font-size:.95rem;text-shadow:2px 2px 0 var(--edge)}
.isle .small{text-shadow:1px 1px 0 var(--edge)}
.isle-art{position:relative;display:grid;place-items:center;max-width:100%}
.isle-art canvas{max-width:100%;height:auto}
.isle-tag{position:absolute;top:34%;font-family:var(--pixel);font-size:.8rem;background:var(--edge);color:var(--acc);padding:0 5px;border:2px solid var(--acc);border-radius:2px}
.fogq{position:absolute;bottom:18%;font-family:var(--pixel);font-size:1.3rem;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.map.themed .region{background:var(--tbg);border-top:6px solid var(--acc)}
.map.themed .region.done{background:linear-gradient(var(--tbg),#2d2a17)}
.map.themed .stepno{color:var(--acc)}
.scard{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:3px solid var(--edge);border-radius:4px;padding:14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}
.steps li::marker{font-family:var(--pixel);color:var(--gold)}
.qrow{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:3px;padding:6px 8px}
.qrow.qdone .small{text-decoration:line-through;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rcard{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:3px;padding:8px;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--edge)}
.rcard:hover{border-color:var(--gold)}
.rcard:active{transform:translate(3px,3px);box-shadow:none}
.rthumb{position:relative;width:64px;aspect-ratio:9/12;border:2px solid var(--edge);border-radius:3px;display:grid;place-items:center}
.rcard.tt .rthumb{background:linear-gradient(135deg,#25f4ee 0 12%,#010101 12% 88%,#fe2c55 88%)}
.rcard.ig .rthumb{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.rcard.yt .rthumb{background:#ff0033;aspect-ratio:16/12}
.rcard.web .rthumb{background:var(--surface-3)}
.rplay{font-size:1.1rem;color:#fff;text-shadow:2px 2px 0 #000}
.rbadge{position:absolute;bottom:-2px;inset-inline:-2px;background:var(--edge);color:#fff;font-size:.6rem;text-align:center;font-weight:600}
.rmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.rmeta b{font-size:.85rem;direction:ltr;unicode-bidi:isolate;text-align:start}
.rmeta span{font-size:.78rem;color:var(--ink-2);overflow-wrap:anywhere}
.rmeta .ropen{color:var(--sky);font-weight:600}
.refs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.refs a{color:var(--sky);text-decoration:underline;text-underline-offset:3px;direction:ltr;unicode-bidi:isolate}
.scanning{display:flex;align-items:center;gap:12px}
.packrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:8px 10px}
.packrow.added{border-color:var(--gold)}
.chip.studio{background:#1f4a36;color:#aef3cc}
.learn{display:flex;flex-direction:column;gap:6px;border-color:var(--green)}
.lsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.lsteps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.lnum{font-family:var(--pixel);background:var(--green);color:#08140d;border:2px solid var(--edge);border-radius:3px;width:24px;height:24px;display:grid;place-items:center;font-size:.8rem}
.learn a,.lpath a{color:var(--sky);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;color:var(--sky);text-decoration:underline;text-underline-offset:3px;font:inherit;text-align:start}
.lpath{margin-top:2px}
.studiobox{border-color:var(--green)}.packrow.skipped{opacity:.55}
@media (max-width:620px){.packrow{grid-template-columns:1fr}}
.scanning canvas{animation:bob .6s steps(2) infinite}
@media (max-width:620px){.types{grid-template-columns:1fr}.qrow{grid-template-columns:auto 1fr}.qrow .small{grid-column:1/-1}}
.path-arrow{position:absolute;font-family:var(--pixel);color:var(--gold);font-size:1.1rem}
.detail{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{border:2px solid var(--edge);background:var(--surface);border-radius:3px;padding:2px 8px;font-size:.76rem;color:var(--muted);box-shadow:2px 2px 0 var(--edge)}
.pip.on{background:var(--green);color:#08140d;font-weight:800}

details.prog{background:var(--surface);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);border-radius:4px}
details.prog>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
details.prog>summary::-webkit-details-marker{display:none}
.pic{width:36px;height:36px;border:2px solid var(--edge);border-radius:3px;display:grid;place-items:center;font-family:var(--pixel);font-size:.85rem;color:#08140d;flex:none}
.pmeta{flex:1;min-width:0}
.secs{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:.82rem;color:var(--ink-2);margin-bottom:6px}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:8px 10px}
.skill+.skill{margin-top:6px}
.skill.m{background:linear-gradient(90deg,#4a3c14,var(--surface-2) 70%)}
[dir="rtl"] .skill.m{background:linear-gradient(270deg,#4a3c14,var(--surface-2) 70%)}
.empty{padding:0 14px 14px;color:var(--muted);font-size:.88rem}

/* discover / misc */
.ask{display:flex;gap:8px;flex-wrap:wrap}
.ask input{flex:1;min-width:0;background:var(--edge);border:2px solid var(--surface-3);border-radius:3px;padding:8px 12px;color:var(--ink);font:inherit}
.coach{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.bubble{background:var(--ink);color:#16202c;border:3px solid var(--edge);border-radius:4px;padding:10px 14px;position:relative}
.bubble b{color:#16202c}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;color:var(--ink-2);font-size:.86rem}
.src{font-size:.74rem;color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.calmonth{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.calweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

/* ---------- Social world: cinematic creator-studio look ---------- */
body.w-social{--bg:#0a0f0d;--surface:#111815;--surface-2:#18211d;--surface-3:#24302a;--edge:#24302a;--ink:#e6eee9;--ink-2:#a9b8b0;--muted:#74857c;--green:#4fd69c;--gold:#d4ae62;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;--pixel:"IBM Plex Mono",ui-monospace,monospace;background:#0a0f0d;background-image:radial-gradient(circle at 80% -10%,rgba(79,214,156,.08),transparent 45%)}
body.w-social .box,body.w-social .tile,body.w-social .col,body.w-social .pday{border:1px solid var(--edge);box-shadow:none;border-radius:16px}

body.w-social .pbtn:active{transform:none}

body.w-social .pbtn.gold{background:var(--gold);color:#1e1606}body.w-social .pbtn.sky{background:#8fc8ff;color:#06131f}
body.w-social .chip,body.w-social .st,body.w-social .opt{border:1px solid var(--edge);border-radius:999px}
body.w-social .opt[aria-pressed="true"]{background:var(--green);color:#06130d;border-color:var(--green)}
body.w-social .pbar{height:8px;border:0;border-radius:99px;background:var(--surface-3)}
body.w-social .pbar i{background:var(--c,var(--green));border-radius:99px}
body.w-social .side{border-inline-end:1px solid var(--edge)}
body.w-social .nav button{border-radius:10px}

[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted)}
.eh{font-size:1.25rem;margin:0}.ep{margin:0;font-size:1.02rem;line-height:1.95;color:var(--ink)}
.vidph{border:3px dashed var(--surface-3);border-radius:4px;padding:18px;text-align:center;color:var(--muted);font-size:.9rem}
.drop{display:block;border:3px dashed var(--sky);border-radius:4px;padding:22px;text-align:center;color:var(--sky);cursor:pointer}
.drop.over{background:rgba(108,198,255,.1)}
.eimg{max-width:100%;border:3px solid var(--edge);border-radius:4px;display:block}
.ba{position:relative;aspect-ratio:16/7;max-width:100%;border:3px solid var(--edge);border-radius:4px;overflow:hidden}
.ba .b1,.ba .b2{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px}
.ba .b1{background:linear-gradient(135deg,#6a6f73,#9ea3a6 50%,#5d6166)}
.ba .b2{background:linear-gradient(135deg,#0f4a55,#d98b4a 55%,#123a44);clip-path:inset(0 0 0 var(--x))}
.ba .b2{justify-content:flex-end}
.ba span{background:var(--edge);color:#fff;font-size:.75rem;padding:1px 6px;border-radius:2px}
.ba .barange{position:absolute;inset-inline:0;bottom:50%;width:100%;opacity:.9;accent-color:var(--gold)}
.callout{border-inline-start:6px solid var(--gold);background:var(--gold-soft,rgba(255,204,77,.1));padding:10px 12px;border-radius:3px}
.dlcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:3px solid var(--edge);border-radius:4px;padding:10px 12px}
.addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:2px dashed var(--surface-3);padding-top:10px}
.loot .box.pubm,.loot .box.pvbox{align-items:stretch;text-align:start}
.loot .art{text-align:start}
.pubm{max-width:560px;width:100%;max-height:92vh;overflow:auto;align-items:stretch;text-align:start}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.cover{aspect-ratio:16/7;border:3px solid var(--edge);border-radius:4px;background:radial-gradient(circle at 70% 30%,#1f6b47,transparent 60%),linear-gradient(135deg,#0a0f0d,#12261c);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;gap:2px}
.cover span{font-weight:800;font-size:1.1rem}.cover small{color:var(--green)}
.pvwrap{display:flex;justify-content:center;background:var(--edge);border-radius:4px;padding:16px}
.pvframe{background:#0a0f0d;border:4px solid #2a3546;overflow:hidden}
.pvframe.phone{width:360px;max-width:100%;border-radius:28px;padding-top:14px}
.pvframe.desktop{width:100%;border-radius:6px}
.art{padding:18px 20px 26px;color:#e6eee9;font-family:"IBM Plex Sans Arabic",var(--body);display:flex;flex-direction:column;gap:12px;max-width:720px;margin-inline:auto}
.art h1{font-size:1.6rem;line-height:1.35}
.art .artnav{display:flex;justify-content:space-between;color:#74857c;font-size:.8rem;border-bottom:1px solid #1c2621;padding-bottom:8px}
.art .artnav b{color:#4fd69c}
.art .artcat{align-self:flex-start;font-size:.72rem;color:#4fd69c;background:rgba(79,214,156,.14);padding:2px 8px;border-radius:99px}
.art .artmeta{font-size:.8rem;color:#74857c}
.art .ep{color:#d7e2dc}
.art .rblk .dlcard,.art .rblk .callout,.art .rblk .ba,.art .rblk .vidph{border-radius:10px}
.art .artsub{background:#111815;border:1px solid #24302a;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px}
.art .artsub span{color:#a9b8b0;font-size:.85rem}
@media (max-width:980px){.ed{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week.busy{opacity:.45}
.pday{background:var(--surface);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pitem{background:var(--surface-2);border:2px solid var(--edge);border-radius:3px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.pitem .pt{font-size:.82rem;font-weight:600;line-height:1.3}
.pitem .check{width:24px;height:24px;font-size:.8rem;align-self:flex-end}
.pitem.pdone .pt{text-decoration:line-through;color:var(--muted)}
.xbtn{background:none;border:0;color:var(--muted);font-size:1rem;padding:0 2px}
.xbtn:hover{color:var(--red)}
.pstats .stat{align-items:flex-start}
.chaps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chap{background:var(--surface-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:start;color:var(--ink)}
.chap[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.chap.live{border-top:6px solid var(--green)}.chap.sched{border-top:6px solid var(--gold)}.chap.draft{border-top:6px solid var(--surface-3)}

.cmt.hidden{opacity:.5}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--surface-3);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow input[type=number],.srow input[type=time],.fin{background:var(--edge);border:2px solid var(--surface-3);border-radius:3px;color:var(--ink);font:inherit;padding:4px 8px}
.srow input[type=number]{width:80px;font-family:var(--pixel)}
.fin{width:100%}
.evline{grid-column:1/-1}
.evchip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;background:var(--edge);border:2px solid var(--surface-3);border-radius:3px;padding:1px 8px;color:var(--sky);text-decoration:none;overflow-wrap:anywhere}

.push .muted{color:#5a6a7e}

@keyframes pushin{from{transform:translate(-50%,-140%)}}
@keyframes pushout{to{transform:translate(-50%,-160%)}}

@keyframes spin{to{transform:rotate(360deg)}}
.sea{animation:waves 5s linear infinite}
@keyframes waves{to{background-position:18px 0,-11px 0}}

.isle:nth-child(3n) .isle-art{animation-delay:-.8s}.isle:nth-child(3n+1) .isle-art{animation-delay:-1.6s}

  const before=pre?pre.lv:levelOf(totalXP()),rb=pre?pre.ri:rankInfo(totalXP());
  const extra=focusOn()?Math.round(xp*.25):0;st.bonus+=extra;
  const tot=xp+extra,g=Math.max(1,Math.round(tot/5))*(activeEvent()==="nd"?2:1);st.gems+=g;st.bossHP=Math.max(0,st.bossHP-tot);
  st.chest++;if(st.chest>=5){st.chest=5;st.chestReady=true}
  const ra=rankInfo(totalXP());return {tot,g,lvUp:levelOf(totalXP())>before?levelOf(totalXP()):0,rankUp:(ra.i!==rb.i||ra.tier!==rb.tier)?ra:null};
}
function toggleQuest(id,q){
  const {k}=find(id);const wasM=isM(k);const pre={lv:levelOf(totalXP()),ri:rankInfo(totalXP())};
  k.done[q]=!k.done[q];
  if(k.done[q]){st.weekDone++;
    const r=gain(qxp(k.tier,q)+(!wasM&&isM(k)?20:0),pre);
    if(!wasM&&isM(k))k.status="mastered";
    justKey=id+"|"+q;st.evQuests=(st.evQuests||0)+1;floatText(`+${r.tot} XP`,"#5ee39a");floatText(`+${r.g} 💎`,"#6cc6ff",36,18);
    tone(SFX.check);setTimeout(()=>tone(SFX.hit),120);
    const mastNow=!wasM&&isM(k),bossNow=st.bossHP===0&&!st.bossDone;if(bossNow){st.bossDone=1;st.gems+=100}
    if(mastNow)setTimeout(()=>celebrate(t("mastBig"),L(k.name),"dance"),300);
    if(bossNow)setTimeout(()=>celebrate(t("bossBig"),t("bossSmall"),"boss"),320);
    if(r.rankUp||r.lvUp){setTimeout(()=>celebrate(r.lvUp?`LEVEL UP! ${r.lvUp}`:t("newTier"),r.rankUp?`${lang==="ar"?r.rankUp.r[1]:r.rankUp.r[2]} ${ROMAN[r.rankUp.tier-1]}`:t("lvlUp")+" "+r.lvUp),350)}
    else if(!mastNow&&!bossNow)toast(`+${r.tot} XP · ${t("bossHit")}`,"gem");
    flashBoss();
  }else{st.weekDone=Math.max(0,st.weekDone-1);if(wasM)k.status="active"}
  render();
}
function floatText(txt,color,dx=0,dy=0){if(!ANIM)return;const d=document.createElement("div");d.className="floater";d.textContent=txt;d.style.left=(lastXY.x+dx)+"px";d.style.top=(lastXY.y+dy)+"px";d.style.color=color;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
const CQ=[];
function closeLayer(){document.getElementById("lootLayer").innerHTML="";if(CQ.length)setTimeout(showCel,250)}
function celebrate(big,small,kind){CQ.push([big,small,kind]);if(!document.querySelector(".celebrate"))showCel()}
function showCel(){const it=CQ.shift();if(!it)return;const[big,small,kind]=it;tone(kind==="boss"?SFX.boss:kind==="dance"?SFX.master:SFX.level);
  if(!ANIM){toast(`${big} · ${small}`,"star");if(CQ.length)setTimeout(showCel,1500);return}
  const lay=document.getElementById("lootLayer");const ri=rankInfo(totalXP());
  lay.innerHTML=`<div class="celebrate" data-close><canvas id="confetti"></canvas><div class="cbanner box ${kind?"cb-"+kind:""}">${kind==="boss"?`<div class="bossx">${spr("boss",8)}</div>`:`<div class="stage scene ${stageCls(ri.i)}">${spr("avatar",4,`data-head="${st.head}" data-gear="${gearOf(levelOf(totalXP()))}" data-rank="${ri.i}"`)}</div>`}<div class="cbig">${big}</div><div class="csmall">${small}</div><button type="button" class="pbtn gold" data-close>${t("nice")}</button></div></div>`;
  lay.querySelectorAll("canvas[data-sprite]").forEach(paint);
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#5ee39a","#ffcc4d","#6cc6ff","#ff8fb3","#a57bff","#ff9d4d"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,c:cols[Math.random()*6|0],s:6+(Math.random()*3|0)*3}));
  const t0=performance.now();(function fr(now){if(!document.getElementById("confetti"))return;ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x/3)*3,Math.round(p.y/3)*3,p.s,p.s)});
    if(now-t0<2600)requestAnimationFrame(fr)})(t0);
  clearTimeout(showCel.tm);showCel.tm=setTimeout(()=>{if(lay.querySelector(".celebrate"))closeLayer()},4200);
}

ubclips from text"},"desc":{"ar":"تظلل الجملة اللي تبغاها في نافذة التفريغ وتعملها Subclip أو تحطها على التايملاين على طول. كده تبني أول نسخة من الفيديو من النص.","en":"Highlight the line you want in the transcript window and make it a subclip or add it to the timeline right away. You build your first cut from text."}}],"steps":[{"ar":"في صفحة Media اختار اللقطة (أو كذا لقطة) في الـ Media Pool.","en":"On the Media page, select the clip (or several clips) in the Media Pool."},{"ar":"اضغط كليك يمين واختار Audio Transcription > Transcribe، أو اضغط أيقونة Transcribe Audio اللي شكلها فقاعة كلام فوق الـ Media Pool.","en":"Right-click and choose Audio Transcription > Transcribe, or click the Transcribe Audio icon (the speech bubble) above the Media Pool."},{"ar":"لما يخلص تفتح نافذة Transcription. اكتب الكلمة في خانة البحث فوق يمين، وهو يلوّن كل مكان انقالت فيه.","en":"When it finishes, the Transcription window opens. Type a word in the search box at the top right and every place it was said gets highlighted."},{"ar":"اضغط على أي كلمة عشان تنط لنفس اللحظة في الفيديو.","en":"Click any word to jump to that moment in the clip."},{"ar":"ظلل الجملة اللي تبغاها واضغط أيقونة Subclip تحت يسار، أو Insert/Append عشان تنزل على التايملاين.","en":"Highlight the line you want and click the Subclip icon at the bottom left, or Insert/Append to send it to the timeline."},{"ar":"لو يبغى النص كملف، صدّره كـ TXT من الزر اللي فوق يمين نافذة التفريغ، وحطه في Obsidian كسكربت.","en":"To keep the text, export it as a TXT file from the button at the top right of the window and drop it in Obsidian as a script."}],"quests":{"train":{"ar":"فرّغ لقطة كلام طويلة عندك (٥ دقايق أو أكتر)، ودوّر على ٣ كلمات، وطلّع منها ٣ Subclips تصلح كـ Hook.","en":"Transcribe a long talking clip (5 min or more), search 3 words, and pull 3 subclips that could work as hooks."},"research":{"ar":"جرّب التفريغ على لقطة إنجليزي ولقطة عربي، وسجّل في Obsidian الدقة في كل وحدة وإيش الأخطاء اللي تتكرر مع اللهجة.","en":"Test transcription on one English clip and one Arabic clip, and log in Obsidian the accuracy of each and which mistakes repeat with dialect."},"produce":{"ar":"ريل ٢٠ ثانية: \"قصّيت الفيديو دا من غير ما أسمعه!\" وبعدين تورّي البحث بكلمة وسحب الجملة للتايملاين في لقطة شاشة سريعة.","en":"20 s reel: \"I cut this video without listening to it!\" then show a word search and dragging the line to the timeline in a quick screen capture."},"article":{"ar":"\"المونتاج بالنص في دافنشي: هل يشتغل مع العربي؟\": إيش يحتاج، الخطوات، تجربتي مع اللهجة، ومتى تستخدمه ومتى لا.","en":"\"Text-based editing in Resolve: does it work with Arabic?\": what you need, the steps, my test with dialect, and when to use it or skip it."}},"trend":{"ar":"المونتاج بالنص من أكتر ميزات الـ AI اللي انتشرت في تيك توك وانستقرام من تحديث 18.5 لحد دحين، وصار يشتغل على التايملاين كمان. ودافنشي 20 زاد عليه IntelliScript في نسخة Studio.","en":"Text-based editing has been one of the most shared AI features on TikTok and Instagram since 18.5, and it now works on timelines too. Resolve 20 added IntelliScript on top of it in Studio."},"refs":[["tt","@cined.com","QUICK TIP! Have you tried the audio transcription feature in DaVinci Resolve?","https://www.tiktok.com/@cined.com/video/7241905801831402778"],["tt","@zac.stevenson_","The new 18.5 update ... transcription feature","https://www.tiktok.com/@zac.stevenson_/video/7229519275986406658"],["tt","@oleg.kovalov","New DaVinci Resolve 19 Transcription Text Based Editing","https://www.tiktok.com/@oleg.kovalov/video/7410167560034979102"],["tt","@itsthewampus","Text Based Editing Now Works on TIMELINES in DaVinci Resolve","https://www.tiktok.com/@itsthewampus/video/7361296717750226206"],["ig","@adamwienckowski","Text-Based Editing in Davinci Resolve: Explained!","https://www.instagram.com/adamwienckowski/reel/Cw6HWeiLWbf/"],["ig","@theqazman","Text-based editing using AI in Resolve","https://www.instagram.com/theqazman/reel/C5Gz50RJbYS/"],["ig","Instagram post","accurate transcription in DaVinci Resolve? With Caption ...","https://www.instagram.com/p/DWUKwCFD5xp/"],["yt","YouTube","Editing with Audio Transcriptions in DaVinci Resolve","https://www.youtube.com/watch?v=D6DzF9Ux5Ac"],["yt","YouTube","How to Transcribe & Make Subtitles in DaVinci Resolve 19 Speed Up Your Edits with Text-Based Editing","https://www.youtube.com/watch?v=M00itrq0vGM"],["yt","YouTube","Edit Your Transcript, Not Your Timeline | DaVinci Resolve AI","https://www.youtube.com/watch?v=_gnxFKokN7k"],["web","CineD","DaVinci Resolve Quick Tip: Audio Transcriptions","https://www.cined.com/davinci-resolve-audio-transcriptions/"],["web","DVResolve.com","Transcribing Audio in DaVinci Resolve","https://dvresolve.com/tutorial/transcribing-audio-in-davinci-resolve/"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي عن التفريغ والمونتاج بالنص في دافنشي، ولا أحد يجاوب \"هل يشتغل مع العربي؟\". دي فرصة كبيرة لأن السؤال مهم لكل صانع محتوى عربي.","en":"No Arabic tutorial found on transcription and text-based editing in Resolve, and nobody answers \"does it work with Arabic?\". Big opportunity since every Arabic creator needs that answer."},"studio":true,"set":"starter"},{"id":"scene-cut-detection","page":"media","ar":"تقطيع المشاهد تلقائي (Scene Cut Detection)","en":"Scene Cut Detection","tier":1,"related":{"ar":"الـ Match Cut","en":"Match cut"},"what":{"ar":"لو عندك فيديو مصدّر جاهز (ملف واحد) وتبغى ترجع تعدّله، دافنشي يلاقي كل القطعات لحاله ويقسّمه للقطات منفصلة. مفيد لإعادة استخدام فيديوهاتك القديمة كريلز أو لتحليل إيقاع المونتاج.","en":"If you have a finished exported video (one flat file) and want to re-edit it, Resolve finds every cut and splits it into separate clips. Great for turning old videos into reels or studying edit rhythm."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"قبل الاستيراد","en":"Before import"},"desc":{"ar":"الطريقة الأصلية تشتغل من الـ Media Storage قبل ما تضيف الملف للـ Media Pool. ولسه موجودة في النسخة المجانية.","en":"The classic method runs from Media Storage before the file goes into the Media Pool. It still works in the free version."}},{"name":{"ar":"راجع النتيجة","en":"Review the result"},"desc":{"ar":"طول الخط في نافذة Scene Detect يوريك قد إيش البرنامج متأكد. الحركة السريعة والفلاش ممكن تطلع قطعات غلط، فاحذفها بـ Delete أو Prune.","en":"Line height in the Scene Detect window shows how confident Resolve is. Fast motion and flashes can create false cuts, so remove them with Delete or Prune."}},{"name":{"ar":"نسخة الـ AI","en":"The AI version"},"desc":{"ar":"في صفحة Edit فيه Timeline > Detect Scene Cuts يقطع الكليب على التايملاين مباشرة، ودا موجود عندك في Studio.","en":"On the Edit page, Timeline > Detect Scene Cuts cuts a clip right on the timeline, and you have it in Studio."}}],"steps":[{"ar":"افتح صفحة Media ودوّر على الفيديو في الـ Media Storage (لا تضيفه للـ Media Pool لسه).","en":"Open the Media page and find the video in Media Storage (do not add it to the Media Pool yet)."},{"ar":"كليك يمين على الملف واختار Scene Cut Detection.","en":"Right-click the file and choose Scene Cut Detection."},{"ar":"في النافذة شيّك إن Auto Cue شغّال من Options، وبعدين اضغط Auto Scene Detect.","en":"In the window, check that Auto Cue is on under Options, then click Auto Scene Detect."},{"ar":"راجع الخطوط: القطعة الغلط اختارها واضغط Delete، أو حط In و Out على منطقة واضغط Prune عشان تمسح كل اللي فيها.","en":"Review the markers: select a false cut and press Delete, or set In and Out around a range and use Prune to clear it."},{"ar":"اضغط Add Cuts to Media Pool تحت يمين، وكل لقطة تنزل كـ Clip لحالها في الـ Media Pool.","en":"Click Add Cuts to Media Pool at the bottom right, and each shot lands as its own clip in the Media Pool."}],"quests":{"train":{"ar":"خذ فيديو يوتيوب قديم لك مصدّر كملف واحد، قطّعه بـ Scene Cut Detection، وطلّع منه ٣ لقطات تصلح لريل جديد.","en":"Take an old YouTube video of yours exported as one file, split it with Scene Cut Detection, and pull 3 shots that could make a new reel."},"research":{"ar":"قطّع ٣ من فيديوهاتك الناجحة وعد كم لقطة فيها ومتوسط طول اللقطة، وسجّل في Obsidian إيش الإيقاع اللي يشتغل مع جمهورك.","en":"Split 3 of your best-performing videos, count the shots and average shot length, and note in Obsidian which pace works with your audience."},"produce":{"ar":"ريل ٤٥ ثانية: \"فيديو عمره سنتين صار ريل جديد في ٥ دقايق\" تورّي فيه التقطيع التلقائي وبعدين النسخة العمودية الجديدة.","en":"45 s reel: \"A 2-year-old video became a new reel in 5 minutes\" showing the auto split and then the new vertical version."},"article":{"ar":"\"كيف ترجع تستخدم فيديوهاتك القديمة بدافنشي\": ليه إعادة التدوير مهمة، خطوات Scene Cut Detection، الأخطاء الشائعة، والفرق بين المجاني والـ Studio.","en":"\"How to recycle your old videos with Resolve\": why repurposing matters, Scene Cut Detection steps, common mistakes, and free vs Studio."}},"trend":{"ar":"في تيك توك وانستقرام فيه فيديوهات كتير تقدّم الـ Detect Scene Cuts كحيلة توفر وقت، خصوصا لإعادة مونتاج فيديوهات قديمة. ولسه تطلع دروس يوتيوب جديدة عنها في ٢٠٢٥ و٢٠٢٦.","en":"TikTok and Instagram have many clips pitching Detect Scene Cuts as a time saver, especially for re-editing old videos. New YouTube tutorials on it keep coming out in 2025 and 2026."},"refs":[["tt","@jhanes_kc","Let's learn how to use scene detect in DaVinci Resolve!","https://www.tiktok.com/@jhanes_kc/video/7462125173412580654"],["tt","@woldancreates","How to re edit an old video with the auto detect scene cuts function","https://www.tiktok.com/@woldancreates/video/7385932474662014213"],["tt","@doubtmetech","Auto Scene Cut Detection in DaVinci Resolve","https://www.tiktok.com/@doubtmetech/video/7329583279881866538"],["tt","@ktmiinch","You might want this editing tip for later - it's called Detect Scene Cuts","https://www.tiktok.com/@ktmiinch/video/7432728633258577195"],["ig","Instagram reel","Scene Cut Detection in DaVinci Resolve Auto-split your ...","https://www.instagram.com/reel/DIySl-GPydI/"],["ig","@millenniallabs.in","Here's how you can do scene cut detection in DaVinci ...","https://www.instagram.com/millenniallabs.in/reel/C40bKHoy1Q5/"],["ig","@fulltimefilmmaker","Quick Video Editing Trick: Scene cut detection is my ...","https://www.instagram.com/fulltimefilmmaker/reel/CyV_E3vuQro/"],["yt","YouTube","Scene Cut Detection in Media Tab - DaVinci Resolve 19","https://www.youtube.com/watch?v=UhEsYMq3V4U"],["yt","YouTube","How to Use Scene Cut Detection in DaVinci Resolve Full Tutorial + Fixes","https://www.youtube.com/watch?v=FAE0XDdqibY"],["yt","YouTube","DaVinci Resolve – Scene Cut Detection Step by Step","https://www.youtube.com/watch?v=mfC69pJ8Cc0"],["web","PremiumBeat","Speed Up Your Color Workflow Using Scene Cut Detection","https://www.premiumbeat.com/blog/speed-color-workflow-using-scene-cut-detection/"],["web","Filmmaking Elements","How To Use Scene Cut Detection In Davinci Resolve (2 Methods)","https://filmmakingelements.com/scene-cut-detection-in-davinci-resolve/"]],"arGap":{"has":true,"ar":"دورت بالعربي عن Scene Cut Detection وما لقيت شرح عربي مخصص. فرصة سهلة لفيديو قصير عملي.","en":"Searched in Arabic for Scene Cut Detection and found no dedicated Arabic tutorial. Easy opportunity for a short practical video."},"studio":true,"set":"starter"},{"id":"source-tape","page":"cut","ar":"الـ Source Tape للاختيار السريع","en":"Source Tape for fast selects","tier":2,"related":{"ar":"الـ Bins والـ Proxies","en":"Bins & proxies"},"what":{"ar":"الـ Source Tape يحط كل كليبات الـ Bin ورا بعض كأنها شريط واحد طويل. بدل ما تفتح كل كليب لحاله، تتفرج على كل التصوير مرة وحدة وتعلّم أحلى اللحظات وترميها في التايملاين على طول.","en":"Source Tape lays every clip in a bin end to end, like one long tape. Instead of opening clips one by one, you scrub through the whole shoot at once, mark the best moments and drop them straight into the timeline."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"ترتيب الشريط = ترتيب الـ Bin","en":"Tape order = bin order"},"desc":{"ar":"الشريط يمشي على حسب ترتيب الكليبات في الـ Media Pool. رتّبها بالـ Timecode أو Date Created عشان تمشي بنفس ترتيب التصوير.","en":"The tape follows the Media Pool sort order. Sort by Timecode or Date Created so it plays in the order you shot."}},{"name":{"ar":"الـ In و Out تعدّي بين الكليبات","en":"In and Out can span clips"},"desc":{"ar":"تقدر تحط In في كليب و Out في كليب تاني، و Resolve ينزّل كل اللي بينهم مرة وحدة. مفيد لما يكون الكلام مقطّع على كذا ملف.","en":"You can set In on one clip and Out on another, and Resolve edits everything in between in one go. Handy when one take is split across files."}},{"name":{"ar":"الـ Fast Review للكليبات الطويلة","en":"Fast Review for long clips"},"desc":{"ar":"زر الـ Fast Review يشغّل الكليب أسرع على حسب طوله، فتشوف تصوير طويل في ثواني وتلقط اللحظة اللي تبغاها.","en":"The Fast Review button plays clips faster based on their length, so you can skim long footage in seconds and spot the moment you want."}}],"steps":[{"ar":"حط كل كليبات الفيديو في Bin واحد، وفي الـ Media Pool رتّبها بالـ Timecode أو Date Created.","en":"Put all the clips for the video in one bin, then sort the Media Pool by Timecode or Date Created."},{"ar":"في صفحة الـ Cut، فوق الـ Viewer من اليسار، اضغط زر Source Tape (جنب Source Clip و Timeline).","en":"On the Cut page, click the Source Tape button at the top left of the viewer (next to Source Clip and Timeline)."},{"ar":"تنقّل في الشريط بـ J و K و L أو اسحب الـ Playhead في شريط الـ Viewer. أسامي الكليبات تطلع عند كل حد بين كليب والتاني.","en":"Move through the tape with J, K and L, or drag the playhead in the viewer's scrubber. Clip names show at each boundary."},{"ar":"لما تلقى لحظة حلوة اضغط I للبداية و O للنهاية.","en":"When you find a good moment, press I for the start and O for the end."},{"ar":"اضغط زر Append عشان تنزل في آخر التايملاين، أو اسحبها للمكان اللي تبغاه. كرر لحد ما تخلص الـ Selects.","en":"Click Append to add it to the end of the timeline, or drag it where you want. Repeat until your selects are done."},{"ar":"لو الشريط طويل، شغّل Fast Review عشان تمشي أسرع، وارجع لـ Timeline لما تبغى تراجع القصّة.","en":"If the tape is long, turn on Fast Review to move faster, and switch back to Timeline when you want to review the cut."}],"quests":{"train":{"ar":"خذ تصوير يوم كامل (فلوق أو طلعة) وطلّع منه ٦٠ ثانية Selects بالـ Source Tape بس، وشوف كم دقيقة أخذت منك.","en":"Take one full day of footage (a vlog or outing) and pull 60 seconds of selects using only Source Tape. Time how long it takes."},"research":{"ar":"قارن بين طريقة الـ Source Tape وطريقة فتح كل كليب لحاله على نفس التصوير، واكتب في Obsidian الفرق في الوقت وإيش اللحظات اللي لقيتها زيادة.","en":"Compare Source Tape against opening clips one by one on the same footage. Note in Obsidian the time difference and which moments you found only with the tape."},"produce":{"ar":"ريل ٣٠ ثانية \"صوّرت ساعة وطلّعت منها ٣٠ ثانية\": تبدأ بشاشة Resolve فيها عشرات الكليبات، وتخلص بالنتيجة النهائية بسرعة.","en":"A 30 s Reel: \"I shot an hour and cut it to 30 seconds.\" Open on a Resolve screen full of clips, end on the fast final result."},"article":{"ar":"\"الـ Source Tape: أسرع طريقة تختار فيها لقطاتك في دافنشي\" : إيش هو، ترتيب الـ Bin، الـ In/Out بين الكليبات، والـ Fast Review.","en":"\"Source Tape: the fastest way to pick your shots in DaVinci\": what it is, bin sort order, In/Out across clips, and Fast Review."}},"trend":{"ar":"Blackmagic نفسها تقدّم الـ Source Tape كأهم ميزة في صفحة الـ Cut، وفيه شروحات كتير عليه في يوتيوب. بس في تيك توك وانستقرام المحتوى عنه قليل، فهو فرصة.","en":"Blackmagic presents Source Tape as a headline Cut page feature, and YouTube has many tutorials on it. Short-form coverage on TikTok and Instagram is thin, which makes it an opening."},"refs":[["tt","@creatorsergeant","How to activate waveform in the source viewer inside of DaVinci Resolve","https://www.tiktok.com/@creatorsergeant/video/7556222784272108801"],["ig","@fatmanderson","Learn Davinci Resolve Shortcuts: Toggle Source Tape","https://www.instagram.com/fatmanderson/reel/DOWNvysDSN3/"],["yt","YouTube","how to use Resolve Source Tape (explained by a Pro)","https://www.youtube.com/watch?v=uT1i9EFy3tM"],["yt","YouTube","Quickly Navigate through Footage with Source Tape in DaVinci Resolve Cut Page","https://www.youtube.com/watch?v=gvcv6NNjmPg"],["yt","YouTube","The B-Roll Jackhammer - Cut Page Source Tape in Resolve 17","https://www.youtube.com/watch?v=5ozAazPXsk8"],["web","Blackmagic Design","DaVinci Resolve – Cut","https://www.blackmagicdesign.com/products/davinciresolve/cut"],["web","Blackmagic Forum","Scroll the source tape on the Cut page","https://forum.blackmagicdesign.com/viewtopic.php?f=21&t=170794"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي مخصص للـ Source Tape. الشروحات العربية تتكلم عن صفحة الـ Cut بشكل عام بس.","en":"No Arabic tutorial dedicated to Source Tape was found. Arabic content only covers the Cut page in general."},"set":"starter","studio":false},{"id":"cut-smart-edits","page":"cut","ar":"أزرار التعديل الذكية: Smart Insert و Ripple Overwrite و Close Up","en":"Smart edit buttons: Smart Insert, Ripple Overwrite, Close Up","tier":2,"related":{"ar":"المونتاج السريع في صفحة الـ Cut","en":"Fast edit on the Cut page"},"what":{"ar":"صفحة الـ Cut فيها أزرار تعديل تفهم مكان الـ Playhead وتختار القصّة الصح لحالها. بدل ما تحط In و Out في التايملاين، تضغط زر واحد والتايملاين يترتب لحاله.","en":"The Cut page has edit buttons that read the playhead position and pick the right edit point for you. Instead of setting timeline In and Out points, you click one button and the timeline sorts itself out."},"ideasTitle":{"ar":"٣ أنواع","en":"3 types"},"ideas":[{"name":{"ar":"Smart Insert","en":"Smart Insert"},"desc":{"ar":"يدخّل الكليب عند أقرب قصّة للـ Playhead ويدفّ الباقي لقدّام. الـ Smart Indicator الصغير في التايملاين يوريك فين بينزل.","en":"Inserts the clip at the edit point closest to the playhead and pushes the rest forward. The small Smart Indicator on the timeline shows where it will land."}},{"name":{"ar":"Ripple Overwrite","en":"Ripple Overwrite"},"desc":{"ar":"يبدّل كليب بكليب تاني حتى لو طولهم مختلف، والتايملاين يطول أو يقصر لحاله بدون فراغات.","en":"Swaps one clip for another even if the lengths differ, and the timeline grows or shrinks on its own with no gaps."}},{"name":{"ar":"Close Up","en":"Close Up"},"desc":{"ar":"يحط نسخة مكبّرة من اللقطة فوق اللقطة الأصلية، زي الـ Punch-in. وبما إن عندك Studio، يستخدم الـ Neural Engine عشان يلقى الوجه ويوسّطه.","en":"Places a zoomed-in copy of the shot on the track above, like a punch-in. Since you have Studio, it uses the Neural Engine to find and center the face."}}],"steps":[{"ar":"في صفحة الـ Cut، شوف صف الأزرار اللي فوق التايملاين تحت الـ Media Pool: Smart Insert و Append و Ripple Overwrite و Close Up و Place on Top و Source Overwrite.","en":"On the Cut page, find the row of buttons above the timeline, under the Media Pool: Smart Insert, Append, Ripple Overwrite, Close Up, Place on Top and Source Overwrite."},{"ar":"Smart Insert: حط الـ Playhead قريب من قصّة، علّم الكليب الجديد بـ I و O في الـ Viewer، وتأكد من الـ Smart Indicator، بعدين اضغط Smart Insert.","en":"Smart Insert: park the playhead near a cut, mark the new clip with I and O in the viewer, check the Smart Indicator, then click Smart Insert."},{"ar":"Ripple Overwrite: حط الـ Playhead على الكليب اللي ما عجبك، علّم الـ Take الأحسن في الـ Viewer، واضغط Ripple Overwrite. الكليب يتبدّل والتايملاين يتعدّل لحاله.","en":"Ripple Overwrite: park the playhead on the clip you don't like, mark the better take in the viewer, and click Ripple Overwrite. The clip is replaced and the timeline adjusts itself."},{"ar":"Close Up: حط الـ Playhead فين تبغى الـ Punch-in في كلامك، علّم نفس اللقطة في الـ Viewer، واضغط Close Up. لو تبغى زووم أكتر أو أقل عدّله من الـ Inspector.","en":"Close Up: park the playhead where you want the punch-in, mark the same shot in the viewer, and click Close Up. Adjust the zoom in the Inspector if needed."},{"ar":"Place on Top للـ B-roll: علّم لقطة الـ B-roll واضغط Place on Top، تنزل في أول تراك فاضي فوق عند الـ Playhead بدون ما تمسح شي تحت.","en":"Place on Top for B-roll: mark the B-roll shot and click Place on Top. It lands on the first free track above at the playhead without touching anything below."}],"quests":{"train":{"ar":"خذ فيديو كلام ٢ دقيقة واعمل كل التعديل بالأزرار دي بس، بدون سحب بالماوس: Smart Insert للقطات، Ripple Overwrite للـ Takes الأحسن، و ٣ Close Up.","en":"Take a 2-minute talking video and edit it using only these buttons, no mouse dragging: Smart Insert for shots, Ripple Overwrite for better takes, and 3 Close Ups."},"research":{"ar":"حلّل ٣ فيديوهات يوتيوب لصنّاع محتوى بيتكلموا للكاميرا وعدّ كم Punch-in في الدقيقة، واكتب في Obsidian فين يحطوها (نكتة، رقم، سؤال).","en":"Analyze 3 talking-head YouTube videos, count punch-ins per minute, and note in Obsidian where they land (a joke, a number, a question)."},"produce":{"ar":"ريل ٤٥ ثانية \"٣ غلطات في المونتاج تضيّع وقتك\": أول ثانيتين Close Up مفاجئ على وجهك وانت تقول \"وقّف!\"، وكل غلطة لها Punch-in.","en":"A 45 s Reel: \"3 editing mistakes that waste your time.\" The first 2 seconds are a sudden Close Up on your face saying \"Stop!\", with a punch-in for each mistake."},"article":{"ar":"\"٦ أزرار في صفحة الـ Cut تختصر نص وقت المونتاج\" : شرح كل زر، متى تستخدمه، وفرقه عن Insert و Overwrite العاديين.","en":"\"6 Cut page buttons that halve your edit time\": each button, when to use it, and how it differs from regular Insert and Overwrite."}},"trend":{"ar":"فيه شروحات يوتيوب جديدة عن دوال الـ Insert في Resolve 20، وريلز انستقرام عن إدخال الكليبات بدون ما تمسح اللي جنبها والـ Punch-ins. الموضوع مطلوب بس نادر يتشرح من صفحة الـ Cut.","en":"Recent YouTube tutorials cover insert functions in Resolve 20, and Instagram Reels cover inserting clips without overwriting and punch-ins. Demand is there, but few explain it from the Cut page."},"refs":[["tt","@thejordanstudios","EASY Way to Insert Clips in Davinci Resolve","https://www.tiktok.com/@thejordanstudios/video/7533325997358337311"],["ig","Instagram","Insert clips between other clips without overwriting in the ...","https://www.instagram.com/reel/C_BYi7XvRFr/"],["ig","@rippletrainers","Ripple Training | How to do Punch-Ins in DaVinci Resolve","https://www.instagram.com/rippletrainers/reel/C534AA7Pmci/"],["ig","Instagram","Pace out your edits in #davinciresolve with the new insert ...","https://www.instagram.com/reel/DSLKVnFiSja/"],["yt","YouTube","How To Use The Smart Insert Tool In DaVinci Resolve 16","https://www.youtube.com/watch?v=DXJeOmlcQ24"],["yt","YouTube","DaVinci Resolve 19: Speed Up Your Edits with the Cut Page","https://www.youtube.com/watch?v=kcAQujJcwvs"],["yt","YouTube","These Secret Insert Functions in DaVinci Resolve 20 Will Save You Hours","https://www.youtube.com/watch?v=cYgmuNlIYOw"],["web","Cutsio","DaVinci Resolve Speed Editor intelligent edit modes: Smart Insert, Append, Ripple Overwrite, Close Up, Place On Top, and Source Overwrite","https://cutsio.com/blog/davinci-resolve-speed-editor-intelligent-edit-modes"],["web","Larry Jordan","Get Started Editing in the DaVinci Resolve Cut Page","https://larryjordan.com/articles/get-started-editing-in-the-davinci-resolve-cut-page/"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي لأزرار Smart Insert و Ripple Overwrite و Close Up في صفحة الـ Cut. الشروحات العربية تشرح Insert و Overwrite العاديين في صفحة الـ Edit بس.","en":"No Arabic tutorial found for Smart Insert, Ripple Overwrite and Close Up on the Cut page. Arabic content only covers regular Insert and Overwrite on the Edit page."},"studio":true,"set":"starter"},{"id":"boring-detector-smooth-cut","page":"cut","ar":"الـ Boring Detector والـ Smooth Cut لفيديوهات الكلام","en":"Boring Detector + Smooth Cut for talking heads","tier":2,"related":{"ar":"الـ J/L Cuts","en":"J/L cuts"},"what":{"ar":"الـ Boring Detector يحلّل طول كل كليب ويلوّن اللقطات الطويلة (اللي ممكن تملّل) والقصيرة جداً (Flash frames). وبعدها الـ Smooth Cut يخبّي الـ Jump cuts في كلامك للكاميرا عشان يطلع كأنه Take واحد.","en":"The Boring Detector checks every clip's length and flags shots that run too long (and may bore viewers) or too short (flash frames). Then Smooth Cut hides the jump cuts in your talking-head edit so it looks like one take."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"الرمادي = طويل، الأحمر = قصير","en":"Gray = too long, red = too short"},"desc":{"ar":"اللقطات الأطول من رقم الـ Boring Clips تتلوّن رمادي فاتح، والأقصر من رقم الـ Jump Cuts تتلوّن أحمر. حط الـ Jump Cuts على ٢ فريم عشان تلقى الـ Flash frames.","en":"Clips longer than the Boring Clips value turn light gray, and clips shorter than the Jump Cuts value turn red. Set Jump Cuts to 2 frames to catch flash frames."}},{"name":{"ar":"الـ Smooth Cut (عندك في Studio)","en":"Smooth Cut (in your Studio)"},"desc":{"ar":"الـ Smooth Cut ترانزشن من أدوات Studio اللي عندك، و Resolve 20 طوّره. يشتغل أحسن لما الكاميرا والإضاءة والخلفية ثابتين.","en":"Smooth Cut is a Studio transition you already have, and Resolve 20 improved it. It works best when camera, lighting and background stay the same."}},{"name":{"ar":"الحركة الكبيرة تخرّبه","en":"Big motion breaks it"},"desc":{"ar":"لو يدك أو شعرك يتحرك كتير بين القصّتين ممكن يطلع Ghosting. ساعتها غطّي القصّة بـ B-roll أو Close Up بدل الـ Smooth Cut.","en":"If your hands or hair move a lot between the two sides, you may get ghosting. Cover the cut with B-roll or a Close Up instead."}}],"steps":[{"ar":"رتّب الكلام في صفحة الـ Cut وشيل السكتات. لو نسختك فيها Clip > Audio Operations > Ripple Delete Silence استخدمه عشان تشيلها أسرع.","en":"Build your talking-head edit on the Cut page and remove the pauses. If your version has Clip > Audio Operations > Ripple Delete Silence, use it to speed this up."},{"ar":"اضغط أيقونة Timeline Options في شريط أدوات التايملاين واختار Boring Detector.","en":"Click the Timeline Options icon in the timeline toolbar and choose Boring Detector."},{"ar":"في نافذة Analyze Timeline Edits، حط الـ Boring Clips على عدد الثواني اللي تشوفه طويل (مثلاً ٥ ثواني للريلز) والـ Jump Cuts على ٢ فريم، واضغط Analyze.","en":"In the Analyze Timeline Edits window, set Boring Clips to the seconds you consider too long (say 5 s for Reels) and Jump Cuts to 2 frames, then click Analyze."},{"ar":"صلّح اللقطات الرمادية بـ B-roll أو Close Up أو قصّة جديدة، وامسح الـ Flash frames الحمرا.","en":"Fix the gray areas with B-roll, a Close Up or a new cut, and delete the red flash frames."},{"ar":"من تبويب Effects روح Video Transitions > Dissolve > Smooth Cut، واسحبه على الـ Jump cut وخلي طوله قصير (٢ لحد ٦ فريم تقريباً).","en":"In the Effects tab, go to Video Transitions > Dissolve > Smooth Cut, drag it onto the jump cut and keep it short (about 2 to 6 frames)."},{"ar":"شغّل المقطع بجودة كاملة وشيّك على الـ Ghosting. لو فيه، غطّي القصّة بـ B-roll بدل الـ Smooth Cut.","en":"Play it back at full quality and check for ghosting. If you see it, cover the cut with B-roll instead."}],"quests":{"train":{"ar":"خذ آخر فيديو كلام عملته، شغّل الـ Boring Detector على ٥ ثواني، وصلّح كل منطقة رمادية، وحط Smooth Cut على ٣ Jump cuts وقارن قبل وبعد.","en":"Take your last talking video, run the Boring Detector at 5 s, fix every gray area, then add Smooth Cut to 3 jump cuts and compare before and after."},"research":{"ar":"طبّق الـ Boring Detector على ٣ ريلز ناجحة (نزّلها في Resolve للتحليل بس) واكتب في Obsidian متوسط طول اللقطة وكم لقطة أطول من ٥ ثواني.","en":"Run the Boring Detector on 3 successful Reels (imported for analysis only) and note in Obsidian the average shot length and how many shots run over 5 seconds."},"produce":{"ar":"ريل ٣٠ ثانية \"فيديو واحد بدون ولا قصّة؟\": أول ثانيتين تقول \"الفيديو دا فيه ١٢ قصّة، تقدر تلقاها؟\"، وفي الآخر توري الـ Smooth Cuts مفتوحة في التايملاين.","en":"A 30 s Reel: \"One take with no cuts?\" The first 2 seconds: \"This video has 12 cuts. Can you spot them?\" End by revealing the Smooth Cuts in the timeline."},"article":{"ar":"\"فيديوك ممل؟ خلّي دافنشي يقولك فين\" : شرح الـ Boring Detector وأرقامه للريلز واليوتيوب، والـ Smooth Cut ومتى ما تستخدمه.","en":"\"Is your video boring? Let DaVinci show you where\": the Boring Detector and its settings for Reels and YouTube, plus Smooth Cut and when not to use it."}},"trend":{"ar":"من نزول Resolve 20، الـ Smooth Cut صار ترند في تيك توك وانستقرام، والكل يوري كيف يخبّي الـ Jump cuts. أما الـ Boring Detector فشروحاته قديمة في يوتيوب ونادر أحد يربطه بالـ Smooth Cut.","en":"Since Resolve 20, Smooth Cut has been all over TikTok and Instagram, with creators showing how it hides jump cuts. Boring Detector tutorials are mostly older YouTube videos, and few pair it with Smooth Cut."},"refs":[["tt","@joshglavinfilms","This new feature in DaVinci Resolve will magically hide jump cuts!","https://www.tiktok.com/@joshglavinfilms/video/7499354791152241942"],["tt","@creatorsergeant","How to hide jumpcuts in davinci resolve 20","https://www.tiktok.com/@creatorsergeant/video/7490184178651270406"],["tt","@mralextech","Hide your MISTAKES with the new Smooth Cut Transition in DaVinci Resolve STUDIO 20","https://www.tiktok.com/@mralextech/video/7507196616005192982"],["ig","@robertsjason_video","Jason Roberts | Fix Jump Cuts FAST in DaVinci Resolve","https://www.instagram.com/robertsjason_video/reel/DLPodtDtW4e/"],["ig","Instagram","Here's the best way to smooth out your jump cuts in Davinci ...","https://www.instagram.com/reel/DMk7FfVNo66/"],["ig","Instagram","The Smooth Cut feature on DaVinci Resolve is super ...","https://www.instagram.com/reel/DIcXGI9Bh6g/"],["ig","Instagram","The new and improved Smooth Cut transition in DaVinci ...","https://www.instagram.com/reel/DJ6yrHjMZCf/"],["yt","YouTube","Detect if Clips are Too Long or Short with the Boring Detector - Resolve 16.1 Tutorial","https://www.youtube.com/watch?v=xn0C6r490KM"],["yt","YouTube","DaVinci Resolve 20 – AI Smooth Cut: Can it fix your Jump Cuts?","https://www.youtube.com/watch?v=zuXS4-K0Tac"],["yt","YouTube","The New SMOOTH CUT Transition in DaVinci Resolve IS AMAZING! Quick Tutorial","https://www.youtube.com/watch?v=epqnrVR38b8"],["web","Envato Tuts+","What is the DaVinci Resolve Boring Detector, and How to Use It?","https://photography.tutsplus.com/articles/what-is-the-davinci-resolve-boring-detector-and-how-to-use-it--cms-108010"],["web","PremiumBeat","DaVinci Resolve's Boring Detector — Offensive or Misunderstood?","https://www.premiumbeat.com/blog/davinci-resolves-boring-detector/"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي للـ Boring Detector ولا للـ Smooth Cut. دي فرصة واضحة لمحتوى عربي.","en":"No Arabic tutorial found for either the Boring Detector or Smooth Cut. A clear opening for Arabic content."},"studio":true,"set":"starter"},{"id":"speed-ramp-retime","page":"edit","ar":"الـ Speed Ramp بالـ Retime Curve","en":"Speed Ramps with Retime Curve","tier":2,"related":{"ar":"Match Cut، ومهارة Speed Ramp حقت CapCut","en":"Match cut, and the CapCut speed ramp skill"},"what":{"ar":"الـ Speed Ramp يعني اللقطة تسرع وبعدين تبطئ بنعومة في نفس الكليب. دا اللي يخلي لقطة السيارة أو الدرون أو الحركة تحس إنها سينمائية وتشد العين.","en":"A speed ramp makes one clip speed up and then slow down smoothly. It is what makes car, drone and action shots feel cinematic and grab attention."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"الـ Speed Points","en":"Speed points"},"desc":{"ar":"هي النقاط اللي تقسم الكليب لأجزاء، وكل جزء له سرعة خاصة فيه. بدونها السرعة تتغير فجأة.","en":"They split the clip into sections, each with its own speed. Without curves the change is sudden."}},{"name":{"ar":"الـ Retime Curve","en":"Retime Curve"},"desc":{"ar":"هنا تحول النقاط الحادة لمنحنى ناعم. المنحنى هو الفرق بين قفزة سرعة مزعجة و Ramp احترافي.","en":"This is where you turn sharp speed changes into a smooth curve. The curve is the difference between a jarring jump and a pro ramp."}},{"name":{"ar":"الـ Optical Flow","en":"Optical Flow"},"desc":{"ar":"لما تبطئ لقطة مصورة 24 أو 30 فريم، البرنامج يخترع فريمات بينها. صور بـ 60 أو 120 فريم لو تقدر، النتيجة أنظف بكثير.","en":"When you slow down 24 or 30 fps footage, Resolve builds in-between frames. Shoot 60 or 120 fps when you can for much cleaner results."}}],"steps":[{"ar":"حط الكليب في التايملاين في صفحة الـ Edit، واختاره واضغط Ctrl+R (أو Cmd+R في الماك) عشان تفتح الـ Retime Controls.","en":"Place the clip on the Edit page timeline, select it and press Ctrl+R (Cmd+R on Mac) to open Retime Controls."},{"ar":"حط البلاي هيد عند بداية الحركة، واضغط على السهم الصغير تحت الكليب واختار Add Speed Point. كرر عند نهاية الحركة.","en":"Move the playhead to where the action starts, click the small arrow under the clip and choose Add Speed Point. Repeat where the action ends."},{"ar":"اسحب الخط اللي فوق الـ Speed Point عشان تغير سرعة كل جزء. مثلا الأجزاء اللي على الأطراف 200% والوسط 30%.","en":"Drag the top handle of each speed point to change each section's speed. For example 200% on the outside sections and 30% in the middle."},{"ar":"كليك يمين على الكليب واختار Retime Curve. تأكد إن الوضع Retime Speed، اختار النقاط واضغط أيقونة الـ Bezier عشان يصير المنحنى ناعم، وعدل الـ handles لحد ما تحس الانتقال طبيعي.","en":"Right-click the clip and choose Retime Curve. Make sure it shows Retime Speed, select the points and click the Bezier icon to smooth them, then adjust the handles until the change feels natural."},{"ar":"من الـ Inspector روح لـ Retime And Scaling، وخلي الـ Retime Process على Optical Flow والـ Motion Estimation على Speed Warp (عندك في Studio) لأحسن نتيجة، أو Enhanced Better لو تبغى سرعة.","en":"In the Inspector, open Retime And Scaling. Set Retime Process to Optical Flow and Motion Estimation to Speed Warp (you have it in Studio) for the best result, or Enhanced Better for speed."},{"ar":"شغل المقطع وشوف الأطراف والخلفية. لو فيه تشويه، جرب Frame Blend أو قلل البطء شوية.","en":"Play it back and watch edges and backgrounds. If you see warping, try Frame Blend or make the slow part a bit less slow."}],"quests":{"train":{"ar":"صور لقطة فيها حركة واضحة بـ 60 فريم (مشي، سيارة، رمي كورة)، واعمل ٣ نسخ Ramp بمنحنيات مختلفة وقارن بينها.","en":"Shoot a clip with clear motion at 60 fps (walking, a car, a ball throw) and make 3 ramp versions with different curves, then compare them."},"research":{"ar":"اختار ٥ فيديوهات سيارات أو درون فيها Speed Ramp، وسجل في Obsidian فين تبدأ البطء، كم يطول، وإيش علاقته بالبيت في الموسيقى.","en":"Pick 5 car or drone videos with speed ramps and note in Obsidian where the slow part starts, how long it lasts, and how it lines up with the music beat."},"produce":{"ar":"ريل ٢٠ ثانية عن قهوة الصباح: أول ثانيتين صب القهوة يبطئ فجأة على البيت، وبعدين Ramp سريع لكل خطوة لحد أول رشفة.","en":"A 20 s reel about morning coffee: in the first 2 seconds the pour suddenly slows on the beat, then fast ramps through each step until the first sip."},"article":{"ar":"مقال بعنوان: الـ Speed Ramp في دافنشي خطوة بخطوة، ليه المنحنى أهم من السرعة نفسها.","en":"Article titled: Speed Ramps in DaVinci Step by Step, Why the Curve Matters More Than the Speed."}},"trend":{"ar":"الـ Speed Ramp لسه من أكثر الحركات اللي تنشرح على TikTok و Instagram لفيديوهات السيارات والعقار والدرون، وفيه شروحات كثير جديدة خاصة بـ DaVinci Resolve 20.","en":"Speed ramps are still one of the most taught edits on TikTok and Instagram for car, real estate and drone videos, with many new tutorials made for DaVinci Resolve 20."},"refs":[["tt","@wbynan","How to Speed Ramp in DaVinci Resolve 20","https://www.tiktok.com/@wbynan/video/7505053923909078302"],["tt","@joshglavinfilms","The new way to speed ramp in DaVinci Resolve finally makes it easy!","https://www.tiktok.com/@joshglavinfilms/video/7499020822539996438"],["tt","@creatorsergeant","How to do a smooth speed ramp transition in DaVinci Resolve !","https://www.tiktok.com/@creatorsergeant/video/7382992456599751942"],["tt","@dimitrikastrappis","Master Speed Ramping in DaVinci Resolve 20 for Real Estate","https://www.tiktok.com/@dimitrikastrappis/video/7493128319332961554"],["ig","DaVinci Resolve","Speed ramp in DaVinci Resolve 20","https://www.instagram.com/reel/DJt9fq1JOVg/"],["ig","Joshua Lee Glavin","The new way to speed ramp in DaVinci Resolve","https://www.instagram.com/reel/DJBCM1MPLir/"],["ig","@taylermedia","I get a lot of questions about how I do my speed ramps","https://www.instagram.com/taylermedia/reel/DGLz6xWSw7n/"],["yt","YouTube","How to Use Retime Curve in DaVinci Resolve - Smooth Speed Ramps Tutorial","https://www.youtube.com/watch?v=0h9C4d07bX8"],["yt","YouTube","DaVinci Resolve 19 - How to use Speed Ramp / Retime Curves / Optical Flow","https://www.youtube.com/watch?v=laq90w2QLBM"],["yt","YouTube","Speed Ramping In DaVinci Resolve 20 (2026 Easy Guide)","https://www.youtube.com/watch?v=2lPvbgSZphU"],["web","Shutterstock Blog","DaVinci Resolve: How To Use Retime Controls and Retime Curves","https://www.shutterstock.com/blog/davinci-resolve-retime-curves"],["web","DVResolve.com","Using Retime Controls to Create Speed Ramps, Freeze Frames, and more","https://dvresolve.com/tutorial/retime-controls-speed-ramp/"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي مخصص للـ Speed Ramp بالـ Retime Curve في دافنشي، بس شروحات عامة للبرنامج. دي فرصة حلوة لفيديو عربي قصير وواضح.","en":"No Arabic tutorial dedicated to Retime Curve speed ramps in DaVinci turned up, only general Resolve courses. A clear short Arabic video here is a real opportunity."},"studio":true,"set":"starter"},{"id":"animated-auto-captions","page":"edit","ar":"ترجمة تلقائية وكابشن متحرك","en":"Auto Subtitles and Animated Captions","tier":2,"related":{"ar":"Text Behind Subject، و Export لـ Instagram Reels","en":"Text behind subject, and Export for Instagram Reels"},"what":{"ar":"دافنشي يقدر يطلع الكلام من الصوت ويحوله لـ Subtitles، وفي نسخة 20 تقدر تحركها كلمة كلمة. أغلب الناس يتفرجون بدون صوت، فالكابشن يخليهم يكملون.","en":"Resolve can turn speech into subtitles, and in version 20 you can animate them word by word. Many people watch on mute, so captions keep them watching."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"Create Subtitles from Audio","en":"Create Subtitles from Audio"},"desc":{"ar":"أداة AI في Studio (عندك) تكتب الكلام لحالها. العربي ممكن يحتاج باكج اللغات الإضافية من الـ Extras، فجرّبه أول.","en":"A Studio AI tool you have that writes the speech for you. Arabic may need the extra transcription language pack from Extras, so test it first."}},{"name":{"ar":"الـ Animated Subtitles","en":"Animated Subtitles"},"desc":{"ar":"في نسخة 20 فيه قوالب زي Word Highlight و Slide In و Statement تنحط على تراك الترجمة كله مرة وحدة.","en":"Version 20 adds templates like Word Highlight, Slide In and Statement that you apply to the whole subtitle track at once."}},{"name":{"ar":"ستايل التراك","en":"Track styling"},"desc":{"ar":"من تبويب Track في الـ Inspector تغير الخط واللون والحجم والمكان لكل الترجمة. خليها في النص فوق منطقة أزرار التطبيق.","en":"The Track tab in the Inspector sets font, color, size and position for every caption. Keep them centered and above the app buttons."}}],"steps":[{"ar":"في صفحة الـ Edit افتح التايملاين، وروح لقائمة Timeline > AI Tools > Create Subtitles from Audio.","en":"On the Edit page, open your timeline and go to Timeline > AI Tools > Create Subtitles from Audio."},{"ar":"اختار اللغة، وحط Max Characters Per Line قليل (مثلا 15 إلى 20) عشان الفيديو العمودي، وخليها سطر واحد، واضغط Create.","en":"Pick the language, set Max Characters Per Line low (around 15 to 20) for vertical video, keep it to one line, and click Create."},{"ar":"راجع الترجمة وصحح الكلمات الغلط، خصوصا الأسماء والعامية. دبل كليك على أي Subtitle عشان تعدله.","en":"Read through and fix wrong words, especially names and slang. Double-click any subtitle to edit it."},{"ar":"افتح الـ Effects وروح لـ Toolbox > Titles، وانزل لقسم Animated، واسحب Word Highlight أو أي قالب على هيدر تراك الترجمة.","en":"Open Effects, go to Toolbox > Titles, scroll to the Animated section and drag Word Highlight or another template onto the subtitle track header."},{"ar":"اختار هيدر تراك الترجمة، وفي الـ Inspector افتح تبويب Track وعدل الخط واللون ولون الـ Highlight والمكان.","en":"Select the subtitle track header, open the Track tab in the Inspector, and set the font, color, highlight color and position."},{"ar":"شغل المقطع كامل وتأكد إن الكلمات تنور في وقتها. لو فيه كلمة تتأخر، عدل طرف الـ Subtitle في التايملاين.","en":"Play the full video and check words highlight on time. If a word lags, trim that subtitle's edge on the timeline."}],"quests":{"train":{"ar":"خذ مقطع كلام دقيقة من عندك، اعمل له ترجمة تلقائية، وجرب ٣ قوالب Animated مختلفة واحفظ الستايل اللي عجبك.","en":"Take one minute of your own talking footage, auto-generate subtitles, try 3 different Animated templates and save the style you like."},"research":{"ar":"حلل ٥ ريلز عربية ناجحة فيها كابشن، وسجل في Obsidian: كم كلمة في السطر، إيش اللون، فين مكانها، وهل فيه Highlight.","en":"Analyze 5 successful Arabic reels with captions and note in Obsidian: words per line, color, position, and whether they use highlights."},"produce":{"ar":"ريل ٣٠ ثانية بعنوان ٣ كلمات حجازية ما يفهمها غيرنا، يبدأ بجملة كبيرة على الشاشة في أول ثانيتين، وكل كلمة تنور وانت تقولها.","en":"A 30 s reel called 3 Hijazi words nobody else gets, opening with a big on-screen line in the first 2 seconds, each word lighting up as you say it."},"article":{"ar":"مقال بعنوان: الترجمة التلقائية العربية في دافنشي، إيش يشتغل في Studio وإيش البديل المجاني.","en":"Article titled: Arabic Auto Subtitles in DaVinci, What Works in Studio and the Free Alternative."}},"trend":{"ar":"الكابشن المتحرك كلمة كلمة صار أساسي في الشورت فورم، و DaVinci Resolve 20 أضاف الـ Animated Subtitles، وفيه شروحات كثير جديدة عليها في TikTok و YouTube.","en":"Word-by-word animated captions are now standard in short-form, and DaVinci Resolve 20 added Animated Subtitles, with many new tutorials on TikTok and YouTube."},"refs":[["tt","@creatorsergeant","Animating automated subtitles word by word in DaVinci Resolve 20 is now easier than aver","https://www.tiktok.com/@creatorsergeant/video/7489855591167298822"],["tt","@jhanes_kc","Animated Subtitles in DaVinci Resolve 20 is amazing!","https://www.tiktok.com/@jhanes_kc/video/7493655580020591915"],["tt","@dynamo_arts","Davinci Resolve Tips and Tricks part 2 (Animated Subtitles)","https://www.tiktok.com/@dynamo_arts/video/7541699471411924231"],["tt","@dawiet_cc","How you add AI auto subtitles in Davinci Resolve in few seconds","https://www.tiktok.com/@dawiet_cc/video/7326594571327048993"],["ig","@creatorsergeant","How I create my automatic captions in DaVinci Resolve","https://www.instagram.com/creatorsergeant/reel/DCTyKn6pzGV/"],["ig","@dtcordonnier","How to Add Auto-Captions in DaVinci Resolve","https://www.instagram.com/dtcordonnier/reel/DFc8naFOO-2/"],["ig","Instagram","Save your animated subtitles in Davinci Resolve 20","https://www.instagram.com/reel/DQJ9tpUjB-D/"],["ig","@adamwienckowski","How to make auto-captions in Davinci Resolve","https://www.instagram.com/adamwienckowski/reel/CwEcbr5oC2j/"],["yt","The Hyphenate","Animated Subtitles & Captions [ DaVinci Resolve 20 ] Tutorial","https://www.youtube.com/watch?v=6ht0k0KnWMk"],["yt","YouTube","Automatically Create Animated Subtitles In Davinci Resolve 20!","https://www.youtube.com/watch?v=9lWWTPzMkQU"],["yt","YouTube","Animated Subtitles In DaVinci Resolve 20 | Full Tutorial","https://www.youtube.com/watch?v=ApKlyi18tVE"],["yt","YouTube (عربي)","كيفية إضافة الترجمة التلقائية في Davinci Resolve المجاني بالعربي","https://www.youtube.com/watch?v=w1Wsom92bpc"],["web","Larry Jordan","Animate Subtitles in DaVinci Resolve 20","https://larryjordan.com/articles/animate-subtitles-in-davinci-resolve-20/"],["web","Blackmagic Forum","Word Highlight in subtitles in Resolve 20","https://forum.blackmagicdesign.com/viewtopic.php?f=40&t=219414"]],"arGap":{"has":false,"ar":"فيه شرح عربي للترجمة التلقائية بإضافة AutoSubs في النسخة المجانية. بس ما لقيت شرح عربي للـ Animated Subtitles حقت نسخة 20 ولا لتفعيل العربي في Create Subtitles from Audio، فدي زاوية لسه فاضية.","en":"An Arabic tutorial exists for auto subtitles using AutoSubs in the free version. None turned up for Resolve 20 Animated Subtitles or enabling Arabic in Create Subtitles from Audio, so that angle is still open."},"studio":true,"set":"starter"},{"id":"adjustment-clip-punch-zoom","page":"edit","ar":"Punch-in Zoom و Shake بالـ Adjustment Clip","en":"Punch-in Zooms and Shake with Adjustment Clips","tier":2,"related":{"ar":"J/L Cuts و Match Cut","en":"J/L cuts and match cut"},"what":{"ar":"الـ Adjustment Clip طبقة فاضية تحطها فوق الكليبات، وأي حركة تحطها عليها تنطبق على كل اللي تحتها. كده تعمل زوم سريع أو هزة عند القطع بدون ما تلمس الكليب الأصلي، وتنسخها لأي مكان.","en":"An Adjustment Clip is an empty layer above your clips, and anything you put on it affects everything below. You get fast zooms or shakes on cuts without touching the original clip, and you can copy them anywhere."},"ideasTitle":{"ar":"٣ أنواع","en":"3 types"},"ideas":[{"name":{"ar":"Punch-in على الكلام","en":"Punch-in on speech"},"desc":{"ar":"زوم مفاجئ ١٠٪ إلى ٢٠٪ على كلمة مهمة. يكسر الملل في فيديوهات الكلام ويخفي الـ jump cut.","en":"A sudden 10 to 20% zoom on a key word. It breaks monotony in talking videos and hides jump cuts."}},{"name":{"ar":"Zoom Transition","en":"Zoom transition"},"desc":{"ar":"زوم سريع داخل آخر فريمات اللقطة الأولى وزوم طالع من اللقطة الثانية، مع Motion Blur عشان يبان ناعم.","en":"A fast zoom into the last frames of shot one and out of shot two, with motion blur so it feels smooth."}},{"name":{"ar":"Impact Shake","en":"Impact shake"},"desc":{"ar":"هزة قصيرة على البيت أو الضربة باستخدام Camera Shake. تعطي طاقة لإيدت الموسيقى والمقاطع الرياضية.","en":"A short shake on a beat or hit using Camera Shake. It adds energy to music edits and sports clips."}}],"steps":[{"ar":"افتح الـ Effects وروح لـ Toolbox > Effects، واسحب Adjustment Clip على تراك فاضي فوق الكليبات عند مكان القطع.","en":"Open Effects, go to Toolbox > Effects, and drag an Adjustment Clip onto an empty track above your clips at the cut."},{"ar":"قصر الـ Adjustment Clip لحد ما يغطي ٦ إلى ١٠ فريمات بس حول القطع.","en":"Trim the Adjustment Clip so it covers only 6 to 10 frames around the cut."},{"ar":"من الـ Effects > Open FX دور على Transform واسحبه على الـ Adjustment Clip. في الـ Inspector حط Keyframe للـ Zoom في البداية، وتقدم كم فريم وارفع الـ Zoom.","en":"From Effects > Open FX, find Transform and drag it onto the Adjustment Clip. In the Inspector, set a Zoom keyframe at the start, move a few frames ahead and raise Zoom."},{"ar":"في نفس الـ Transform افتح Advanced Options وارفع الـ Motion Blur، ما يشتغل إلا لو فيه Keyframes.","en":"In the same Transform effect, open Advanced Options and raise Motion Blur. It only works when there are keyframes."},{"ar":"اضغط أيقونة الـ Keyframes تحت الكليب في التايملاين، اختار النقاط، وخليها Ease In و Ease Out من الـ Curve Editor عشان الحركة تبدأ وتوقف بنعومة.","en":"Click the keyframe icon on the clip in the timeline, select the points, and set Ease In and Ease Out in the curve editor so the move starts and stops smoothly."},{"ar":"للهزة زيد Camera Shake من Open FX على نفس الـ Adjustment Clip، وعدل Pan و Tilt Amplitude والسرعة. بعدين Alt+سحب (Option في الماك) عشان تنسخه لأي قطع ثاني.","en":"For a shake, add Camera Shake from Open FX on the same Adjustment Clip and tune Pan and Tilt Amplitude and speed. Then Alt+drag (Option on Mac) to copy it to any other cut."}],"quests":{"train":{"ar":"خذ فيديو كلام ٣٠ ثانية من عندك وحط ٤ Punch-ins بالـ Adjustment Clip على أهم الكلمات، وجرب مع Motion Blur وبدونه.","en":"Take 30 s of your talking footage and add 4 Adjustment Clip punch-ins on the key words, with and without motion blur."},"research":{"ar":"اختار ٣ يوتيوبرز كلام معروفين وعد كم Punch-in في أول دقيقة، وسجل في Obsidian هل هي على نكتة ولا معلومة ولا قطع.","en":"Pick 3 well-known ta
