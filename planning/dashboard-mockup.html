en stack jobs in the Render Queue and hit Render All. One click gives you the YouTube master, the Reels file, and an archive copy while you do something else."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"بريسيتات خاصة فيك","en":"Custom render presets"},"desc":{"ar":"الـ Save As New Preset يحفظ الفورمات والكوديك والبت ريت والتاقات. وتقدر تعمل Export Preset و Import Preset عشان تنقلها لجهاز ثاني.","en":"Save As New Preset stores format, codec, bitrate, and tags. You can also Export Preset and Import Preset to move them to another computer."}},{"name":{"ar":"كل job لها إعداداتها","en":"Each job keeps its own settings"},"desc":{"ar":"أول ما تضيف job للـ queue، تغيير الـ Render Settings بعدها ما يأثر عليها. يعني تقدر تضيف نفس التايم لاين 3 مرات بـ 3 بريسيتات.","en":"Once a job is in the queue, changing Render Settings doesn't change it. So you can queue the same timeline 3 times with 3 presets."}},{"name":{"ar":"كليبات منفصلة وأكثر من تايم لاين","en":"Individual clips and many timelines"},"desc":{"ar":"خيار Render: Individual clips يطلّع كل كليب كملف لوحده (حلو لباكج B-roll أو شورتس مقطوعة في تايم لاين واحد)، وتقدر تضيف أكثر من تايم لاين من نفس المشروع للـ queue.","en":"Render: Individual clips exports every clip as its own file (great for a B-roll pack or Shorts cut on one timeline), and you can queue several timelines from the same project."}}],"steps":[{"ar":"في صفحة الـ Deliver جهّز أول فورمات (مثلا إعدادات يوتيوب 4K)، وبعدين اضغط الثلاث نقاط (...) فوق الـ Render Settings > Save As New Preset.","en":"On the Deliver page set up your first format (for example your YouTube 4K settings), then click the three dots (...) at the top of Render Settings > Save As New Preset."},{"ar":"كرّر لكل نسخة تحتاجها: ريلز 1080x1920 للتايم لاين العمودي، H.264 خفيف للواتساب، وماستر ProRes أو DNxHR للأرشيف.","en":"Repeat for each output you need: Reels 1080x1920 for your vertical timeline, a light H.264 for WhatsApp, and a ProRes or DNxHR master for archive."},{"ar":"اختار التايم لاين من القائمة اللي فوق الـ viewer، اضغط على البريسيت، وحدد Render على Entire Timeline أو In/Out Range، واكتب الاسم والـ Location.","en":"Pick the timeline from the dropdown above the viewer, click a preset, set Render to Entire Timeline or In/Out Range, and set the name and Location."},{"ar":"اضغط Add to Render Queue، بعدين اضغط البريسيت اللي بعده وضيف مرة ثانية. كل job تطلع في الـ Render Queue على اليمين.","en":"Click Add to Render Queue, then click the next preset and add again. Each job shows up in the Render Queue on the right."},{"ar":"لو عندك كليبات قصيرة كثير في تايم لاين واحد، اختار Render: Individual clips ومن تبويب File خلّي Filename uses على Source Name.","en":"For many short clips in one timeline, choose Render: Individual clips and in the File tab set Filename uses to Source Name."},{"ar":"اضغط Render All وخلّيه يشتغل. ومن قائمة الـ Render Queue (...) اختار Show All Projects لو تبغى تشوف jobs من مشاريع ثانية.","en":"Click Render All and walk away. In the Render Queue menu (...) choose Show All Projects to see jobs from other projects too."}],"quests":{"train":{"ar":"اعمل 3 بريسيتات (YouTube 4K و Reels عمودي و WhatsApp خفيف) وصدّر مشروع واحد بالثلاثة في Render All وحدة. احسب كم أخذ وقت.","en":"Make 3 presets (YouTube 4K, vertical Reels, light WhatsApp) and render one project with all 3 in a single Render All. Time how long it takes."},"research":{"ar":"شوف كيف 3 صناع محتوى يسمّوا ويرتبوا ملفات التصدير والبريسيتات، واكتب في Obsidian قاعدة تسمية خاصة فيك (مثلا 3zProd_Title_YT4K_v1).","en":"See how 3 creators name and organize their exports and presets, then write your own naming rule in Obsidian (for example 3zProd_Title_YT4K_v1)."},"produce":{"ar":"تيك توك 25 ثانية: \"أصدّر 3 فيديوهات بضغطة وحدة\". الهوك في أول ثانيتين: الـ Render Queue تتعبى jobs قدامك، وبعدين شرح سريع على الشاشة.","en":"A 25 s TikTok: \"I export 3 videos with one click.\" Hook in the first 2 s: the Render Queue filling up with jobs, then a fast screen walkthrough."},"article":{"ar":"مقال \"صدّر بذكاء في دافنشي: البريسيتات والـ Render Queue\": ليه البريسيتات، كيف تعملها، التصدير الجماعي، الكليبات المنفصلة، ومشاركة البريسيتات مع فريقك.","en":"Article \"Export smarter in DaVinci Resolve: render presets and the Render Queue\": why presets, making them, batch rendering, individual clips, and sharing presets with your team."}},"trend":{"ar":"نصايح قصيرة زي \"صدّر أكثر من تايم لاين مرة وحدة\" و\"صدّر كل كليب لوحده\" تتكرر في تيك توك وإنستقرام، لأن صناع المحتوى صاروا ينزلوا نفس المحتوى بأكثر من مقاس.","en":"Short tips like \"export multiple timelines at once\" and \"export every clip separately\" keep showing up on TikTok and Instagram, as creators post the same content in several formats."},"refs":[["tt","@jtechwp","Davinci Resolve 18.5 How to export multiple timelines fast","https://www.tiktok.com/@jtechwp/video/7273469032085409057"],["tt","@therealewanlim","Exporting multiple clips all at once in #davinciresolve","https://www.tiktok.com/@therealewanlim/video/7251600520178158849"],["tt","@dawiet_cc","How you export multiple separate clips out of your timeline in Davinci Resolve 18","https://www.tiktok.com/@dawiet_cc/video/7328864280374234400"],["tt","@dollarmoovies","DaVinci Resolve has this option in the deliver tab that allows you to export all of the clips in your timeline as individual clips","https://www.tiktok.com/@dollarmoovies/video/7559418115017231671"],["ig","@jtechwp","How to export multiple timelines in Davinci Resolve 18.5 ...","https://www.instagram.com/jtechwp/reel/CwnBjYIo3Vr/"],["ig","Instagram","Want to speed up your exporting workflow in DaVinci ...","https://www.instagram.com/p/DS0tH-XD6fd/"],["yt","YouTube","DaVinci Resolve Render Presets and Quick Export in 3 Minutes","https://www.youtube.com/watch?v=2dm-3PiL5gE"],["yt","YouTube","How to Save, Export, and Import Render Presets in DaVinci Resolve 18.6","https://www.youtube.com/watch?v=RyYd8CF9JiA"],["yt","YouTube","DaVinci Resolve 18: Export multiple timelines with one click..","https://www.youtube.com/watch?v=stiTACO6PA0"],["web","davinciresolve21.com","How to Queue Renders Overnight and Unattended in DaVinci Resolve","https://davinciresolve21.com/blog/davinci-resolve-how-to-queue-renders-overnight-unattended"],["web","VFXPedia (Resolve 18.6 manual mirror)","Using the Render Queue","https://www.steakunderwater.com/VFXPedia/__man/Resolve18-6/DaVinciResolve18_Manual_files/part3956.htm"]],"arGap":{"has":true,"ar":"البحث العربي طلّع شروحات تصدير عامة بس، وما لقيت شي مركّز على الـ Render Queue أو البريسيتات أو التصدير الجماعي. فرصة محتوى.","en":"Arabic searches found only general export tutorials, nothing focused on the Render Queue, custom presets, or batch exporting. Content opportunity."},"set":"starter","studio":false},{"id":"magic-mask-remove","page":"color","ar":"Magic Mask 2 و Object Removal: اعزل أي حاجة أو امسحها","en":"Magic Mask 2 + Object Removal: isolate or erase anything","tier":2,"studio":true,"related":{"ar":"مهارة \"الكتابة ورا الشخص\" تستخدم Magic Mask للخدعة بس. هنا نتعلم الأداة نفسها بالعمق، وكمان نمسح أشياء من اللقطة.","en":"The \"text behind subject\" skill uses Magic Mask only for that trick. Here you learn the tool itself in depth, and you also erase things from the shot."},"what":{"ar":"Magic Mask 2 في Resolve 20 يعزل شخص أو أي عنصر بنقرات بسيطة ويتتبعه في اللقطة كلها. بعدين تقدر تلوّنه لوحده، أو تعطي الماسك لـ Object Removal عشان يمسح العنصر ويعبّي مكانه من الخلفية.","en":"Magic Mask 2 in Resolve 20 isolates a person or any object with a few clicks and tracks it through the whole shot. Then you can grade it on its own, or feed the mask to Object Removal so it erases the object and fills the gap from the background."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"نقاط بدل الرسم","en":"Points, not outlines"},"desc":{"ar":"ما تحتاج ترسم حدود العنصر. حط نقطة أو خط على الشي اللي تبغاه، ونقطة طرح على اللي ما تبغاه، والذكاء يكمّل الباقي.","en":"You do not trace the edge. Drop a point or stroke on what you want, a subtract point on what you do not, and the AI does the rest."}},{"name":{"ar":"الماسك هو المفتاح","en":"The mask is the key"},"desc":{"ar":"Object Removal يشتغل على الـ alpha اللي يجيه من الماسك. كل ما كان الماسك أنظف وأوسع شوية من العنصر، كان المسح أنظف.","en":"Object Removal works from the alpha the mask gives it. A clean mask that is slightly bigger than the object gives a cleaner removal."}},{"name":{"ar":"الخلفية الثابتة أسهل","en":"Static backgrounds win"},"desc":{"ar":"لو الكاميرا ثابتة أو الخلفية بسيطة، النتيجة تطلع ممتازة. لو الخلفية معقدة وتتحرك كثير، توقّع تحتاج Patch Replacer أو Fusion للتنظيف.","en":"Locked-off camera or a simple background gives great results. A busy, moving background may still need Patch Replacer or Fusion for cleanup."}}],"steps":[{"ar":"في صفحة Color اعمل Node جديد وافتح لوحة Magic Mask. حط نقاط على العنصر اللي تبغى تعزله أو تمسحه.","en":"On the Color page add a new node and open the Magic Mask palette. Place points on the object you want to isolate or remove."},{"ar":"لو الماسك دخل على الخلفية، استخدم أداة الطرح وحط نقطة على الجزء الزايد. بعدين اضغط Track Forward و Track Backward.","en":"If the mask spills into the background, use the subtract tool on the extra area. Then run Track Forward and Track Backward."},{"ar":"نظّف الحواف من Matte Finesse، وكبّر الماسك شوية عشان يغطي الظل والحواف لو ناوي تمسح.","en":"Clean the edges in Matte Finesse, and grow the mask a little so it covers edges and shadow if you plan to remove the object."},{"ar":"للتلوين: لوّن العنصر في نفس الـ Node، أو اقلب الماسك عشان تلوّن كل حاجة غيره.","en":"To grade: grade the object in the same node, or invert the mask to grade everything except it."},{"ar":"للمسح: اعمل Node بعده ووصّل الـ key output من Node الماسك للـ key input حقه. حط Object Removal عليه واضغط Scene Analysis.","en":"To remove: add a node after it and connect the mask node's key output to its key input. Drop Object Removal on it and click Scene Analysis."},{"ar":"شغّل اللقطة بسرعة كاملة ودوّر على أي رجفة أو بقعة. صلّحها بالماسك أو كمّل بـ Patch Replacer.","en":"Play the shot at full speed and look for flicker or smudges. Fix the mask or finish with Patch Replacer."}],"quests":{"train":{"ar":"صوّر ٣ لقطات: كاميرا ثابتة وحد يمر في الخلفية، لقطة فيها لوحة أو علامة، ولقطة بحركة كاميرا بسيطة. جرّب Magic Mask و Object Removal على الثلاث وشوف فين ينجح وفين يخرب.","en":"Shoot 3 clips: a locked-off shot with someone walking in the background, a shot with a sign or logo, and a shot with a light camera move. Try Magic Mask + Object Removal on all three and note where it works and where it breaks."},"research":{"ar":"قارن ٣ من الشروحات تحت (يوتيوب وتيك توك). اكتب في Obsidian: إيش الإعدادات اللي كل واحد يستخدمها في Matte Finesse، وإيش نوع اللقطات اللي نجح فيها المسح.","en":"Compare 3 of the tutorials below (YouTube and TikTok). Note in Obsidian which Matte Finesse settings each uses and which kinds of shots the removal worked on."},"produce":{"ar":"ريل ٢٠ ثانية \"الشارع كان زحمة... دحين فاضي\". الثانية الأولى تبين اللقطة الأصلية فيها ناس أو سيارة، وبعدها سحبة بين قبل وبعد. اختم بـ \"عز ينتج\".","en":"20 s reel: \"It was crowded... now it's empty.\" Second one shows the original shot with people or a car, then a before/after wipe. End on the 3z Prod tag."},"article":{"ar":"\"امسح أي حاجة من الفيديو في DaVinci Resolve 20\": ١) إيش الجديد في Magic Mask 2 ٢) عزل العنصر بالنقاط ٣) ربط الماسك بـ Object Removal ٤) متى تحتاج Patch Replacer ٥) أخطاء شائعة.","en":"\"Erase anything from your video in DaVinci Resolve 20\": 1) What's new in Magic Mask 2 2) Isolating with points 3) Feeding the mask to Object Removal 4) When to reach for Patch Replacer 5) Common mistakes."}},"trend":{"ar":"مقاطع \"قبل وبعد\" اللي يختفي فيها شخص أو سيارة منتشرة جداً، ومع Magic Mask 2 في Resolve 20 وتحديثاته في Resolve 21 الناس رجعت تعمل عليها شروحات كثيرة.","en":"Before/after clips where a person or car vanishes are very popular, and Magic Mask 2 in Resolve 20 plus its updates in Resolve 21 brought a new wave of tutorials."},"refs":[["yt","youtube.com","Remove Any Object with AI in DaVinci Resolve 20 | Magic Mask & Object Removal Tutorial + LUTS","https://www.youtube.com/watch?v=Pvh5uda0ibs"],["yt","youtube.com","How to Use Magic Mask 2 in Davinci Resolve 20 Tutorial","https://www.youtube.com/watch?v=inwewH5LTsk"],["yt","youtube.com","NEW Magic Mask 2 in DaVinci Resolve Studio 20 is INCREDIBLE! Full Tutorial & Examples","https://www.youtube.com/watch?v=UB7mOG9eNxg"],["tt","@wbynan","Object Removal in DaVinci Resolve 20: Step-by-Step Guide","https://www.tiktok.com/@wbynan/video/7521744717483085086"],["tt","@josephlipsen","Explore the Magic Mask Effect in DaVinci Resolve","https://www.tiktok.com/@josephlipsen/video/7504465419328326942"],["tt","@davidshuttmedia","AI Magic Mask in Davinci Resolve 20 - remove backgrounds, blur faces and isolate for colour","https://www.tiktok.com/@davidshuttmedia/video/7574190300806122774"],["tt","@moumen.612","كيف تسوي إزالة لأي عنصر في الفيديو (Arabic)","https://www.tiktok.com/@moumen.612/video/7530322226189536568"],["ig","instagram.com","How to use the magic mask easily inside DaVinci Resolve!","https://www.instagram.com/reel/DbYD5nbuCqw/"],["ig","instagram.com","How to use Magic Mask like a pro in DaVinci Resolve 21.1","https://www.instagram.com/reel/DdOgjNDgKbC/"],["ig","instagram.com","Great update for Magic Mask In DaVinci Resolve 21","https://www.instagram.com/reel/DXjRKI5DcwV/"],["web","larryjordan.com","Two Amazing Ways to Clean Up a Shot in DaVinci Resolve 20","https://larryjordan.com/articles/two-amazing-ways-to-remove-something-from-a-shot-in-davinci-resolve-20/"],["web","easyedit.pro","How to Remove Objects in DaVinci Resolve (in Color, Fusion or Edit tabs)","https://easyedit.pro/blog/how-to-remove-objects-in-da-vinci-resolve-in-color-fusion-or-edit-tabs"]],"arGap":{"has":false,"ar":"لقيت ريل عربي قصير (@moumen.612) عن إزالة العناصر بالدافنشي. بس شرح عربي كامل وطويل لـ Magic Mask 2 مع Object Removal لسه قليل، فيه فرصة لفيديو يوتيوب.","en":"Found a short Arabic reel (@moumen.612) on object removal in Resolve. A full long-form Arabic tutorial on Magic Mask 2 + Object Removal is still rare, so a YouTube deep dive is an opening."},"set":"studio"},{"id":"relight-fx","page":"color","ar":"Relight FX: إضاءة جديدة بالذكاء الاصطناعي","en":"Relight FX: AI relighting in post","tier":3,"studio":true,"related":{"ar":"مهارة \"إضاءة الوجه بالـ Power Windows والتتبع\" هي الطريقة اليدوية. هنا الأداة الذكية اللي تفهم شكل الوجه والأشياء وتوزع الضوء عليها.","en":"\"Relight a face with Power Windows and tracking\" is the manual method. This is the AI tool that reads the shape of faces and objects and lights them accordingly."},"what":{"ar":"Relight يحلل الصورة ويطلع Surface Map (خريطة اتجاه الأسطح). بعدين تضيف مصدر ضوء افتراضي، والضوء ينعكس على الوجه والأشياء كأنه ضوء حقيقي، مو دائرة ثابتة على الشاشة زي Power Window.","en":"Relight analyzes the image and builds a Surface Map (which way each surface faces). You then add a virtual light, and it falls on faces and objects like a real light, not a fixed shape on screen like a Power Window."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"Surface Map هو السر","en":"The Surface Map is the magic"},"desc":{"ar":"الأداة تحسب اتجاه كل سطح في الصورة. عشان كده الضوء يلف على الخد والأنف بشكل طبيعي لما تحرّكه.","en":"The tool works out which way every surface faces. That is why the light wraps around cheeks and nose naturally as you move it."}},{"name":{"ar":"٣ أنواع ضوء","en":"Three light types"},"desc":{"ar":"Directional زي الشمس، Point زي لمبة، و Spotlight زي كشاف. اختار حسب إيش تبغى تقلّد.","en":"Directional acts like the sun, Point like a bulb, Spotlight like a focused lamp. Pick based on what you want to fake."}},{"name":{"ar":"قسّم الشغل على Node ين","en":"Split it across two nodes"},"desc":{"ar":"الأداة ثقيلة. تقدر تخلي Node أول يطلع الـ Surface Map بس (Output Surface Map)، والثاني يستخدمه للإضاءة. كده التعديل أسرع.","en":"It is heavy. Let a first node output only the Surface Map (Output Surface Map) and a second node use it for lighting. Tweaking gets faster."}}],"steps":[{"ar":"خلّص التوازن الأساسي أول. بعدين اعمل Node جديد وحط عليه Relight من مكتبة Resolve FX.","en":"Finish your base balance first. Then add a new node and drop Relight on it from the Resolve FX library."},{"ar":"اختار نوع الضوء (Directional أو Point أو Spotlight) وحرّكه بالتحكم اللي على الشاشة لحد ما يجي من الجهة اللي تبغاها.","en":"Choose the light type (Directional, Point or Spotlight) and drag the on-screen control until it comes from the side you want."},{"ar":"اضبط Intensity واللون. ضوء دافي خفيف من جهة الشباك عادة يطلع أطبع من ضوء قوي.","en":"Set Intensity and color. A soft warm light from the window side usually looks more natural than a strong one."},{"ar":"لو الضوء يطلع فوق الخلفية كمان، حط Magic Mask أو window على نفس الـ Node عشان يحصره على الشخص.","en":"If the light also hits the background, add a Magic Mask or a window on the same node to limit it to the subject."},{"ar":"لو الجهاز بطيء، اعمل Node أول بـ Output Surface Map، والـ Node الثاني يقرأ الخريطة منه. وفعّل Render Cache على الـ Node الأول.","en":"If playback is slow, make a first node with Output Surface Map and have the second node read the map from it. Turn on Render Cache for the first node."}],"quests":{"train":{"ar":"خذ لقطة لوجهك بإضاءة مسطحة. اعمل منها ٣ نسخ بـ Relight: ضوء جانبي درامي، ضوء غروب دافي، وضوء شاشة جوال أزرق من تحت. قارنهم بالطريقة اليدوية بالـ Power Windows.","en":"Take a flat-lit clip of your face. Make 3 versions with Relight: dramatic side light, warm sunset light, and blue phone-screen light from below. Compare with the manual Power Window method."},"research":{"ar":"شوف ٣ شروحات من تحت، واكتب في Obsidian: إيش نوع الضوء اللي استخدموه، وكم Intensity، وفين بان إن الضوء مزيف.","en":"Watch 3 tutorials below and note in Obsidian which light type they used, what Intensity, and where the light started to look fake."},"produce":{"ar":"ريل ٣٠ ثانية \"صوّرت في غرفة مظلمة؟ دحين صلّحها\". الثانية الأولى لقطة مظلمة مسطحة، وبعدها يتحرك الضوء على الوجه مباشرة قدام المشاهد. اختم بقبل وبعد.","en":"30 s reel: \"Shot in a dark room? Fix it now.\" Open on a flat, dark shot, then move the light across the face live on screen. End with a before/after."},"article":{"ar":"\"Relight في DaVinci Resolve: غيّر الإضاءة بعد التصوير\": ١) إيش هو Surface Map ٢) أنواع الضوء ٣) حصر الضوء بالماسك ٤) تسريع الأداء بـ Node ين ٥) متى ترجع للطريقة اليدوية.","en":"\"Relight in DaVinci Resolve: change the lighting after the shoot\": 1) What a Surface Map is 2) Light types 3) Limiting light with a mask 4) Speeding it up with two nodes 5) When to go back to the manual way."}},"trend":{"ar":"ريلز \"الأداة دي بتغيّر إضاءة الفيديو\" رجعت تنتشر مع Resolve 20، وكثير منهم يجمع Relight مع Depth Map عشان الضوء يحترم المسافات.","en":"\"This tool relights your video\" reels are trending again with Resolve 20, and many combine Relight with Depth Map so the light respects distance."},"refs":[["yt","youtube.com","Using Relight Effect to fix your Footage! - Davinci Resolve 19 Tutorial","https://www.youtube.com/watch?v=h9U3rrvGa40"],["yt","youtube.com","How to use RELIGHT FX in Davinci Resolve! | EASY Tutorial!","https://www.youtube.com/watch?v=uG6DrUtBoI0"],["yt","youtube.com","Color Grading 2024 | Part 13 | Relight & Depth Map Davinci Resolve 19 Tutorial for Beginners","https://www.youtube.com/watch?v=nk4xuzmVbt0"],["tt","@wbynan","Relight effect in DaVinci Resolve","https://www.tiktok.com/@wbynan/video/7511731238596660511"],["tt","@dawiet_cc","You messed up the lighting on your video shot? ... relight effect","https://www.tiktok.com/@dawiet_cc/video/7469137352749878550"],["tt","@cameronradice","The relight tool in Davinci 18.5 is MAGIC","https://www.tiktok.com/@cameronradice/video/7270668554100575534"],["tt","@wbynan","Depth Map Relight in DaVinci Resolve","https://www.tiktok.com/@wbynan/video/7525460757484408094"],["ig","instagram.com","This tool called \"Relight\" from Davinci Resolve is insanely ...","https://www.instagram.com/reel/DSDUqayDE3U/"],["ig","instagram.com","How to relight your subjects in post in Davinci Resolve 20","https://www.instagram.com/reel/DUGJ3NbDDzf/"],["ig","instagram.com","Depth Map Relight in DaVinci Resolve 20","https://www.instagram.com/reel/DL7j-M-xiDL/"],["web","nofilmschool.com","How To Use DaVinci Resolve 18.5's Powerful New Relighting Tool","https://nofilmschool.com/blackmagic-davinci-resolve-relight-fx-tool"],["web","steakunderwater.com","Setting up Relight (Resolve 18.6 manual mirror)","https://www.steakunderwater.com/VFXPedia/__man/Resolve18-6/DaVinciResolve18_Manual_files/part3277.htm"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي واضح لـ Relight في الدافنشي. فرصة حلوة لريل أو فيديو يوتيوب بالعربي من \"عز ينتج\".","en":"No clear Arabic tutorial on Relight in Resolve turned up. Good opening for an Arabic reel or YouTube video from 3z Prod."},"set":"studio"},{"id":"depth-map-dof","page":"color","ar":"Depth Map: عمق ميدان وضباب وتلوين حسب المسافة","en":"Depth Map: fake depth of field, fog and depth-based grading","tier":2,"studio":true,"related":{"ar":"مهارة \"الماسك وتغبيش الخلفية\" تعتمد على Power Window. هنا الذكاء يحسب بُعد كل بكسل، فالتغبيش والضباب يزيدوا بالتدريج كل ما بعدت.","en":"The \"mask + background blur\" skill relies on a Power Window. Here the AI estimates the distance of every pixel, so blur and fog build up gradually with distance."},"what":{"ar":"Depth Map في Resolve FX يطلع خريطة أبيض وأسود: القريب أبيض والبعيد أسود (أو العكس). تستخدمها كماسك عشان تغبّش الخلفية، أو تضيف ضباب أو غبار، أو تغمّق البعيد بس.","en":"The Depth Map Resolve FX generates a black and white map: near is white, far is black (or inverted). Use it as a matte to blur the background, add haze or dust, or darken only the distance."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"Near و Far Limit","en":"Near and Far Limit"},"desc":{"ar":"دول أهم إعدادين. يحددوا من فين يبدأ القريب ولحد فين البعيد، وكده تتحكم في منطقة التأثير.","en":"These are the two key controls. They set where near starts and where far ends, so you control which zone gets affected."}},{"name":{"ar":"انتقال ناعم بدل حواف","en":"Soft falloff, not hard edges"},"desc":{"ar":"بعكس Magic Mask، الخريطة تدرّجية. عشان كده ممتازة للضباب والتغبيش لأنها ما تعطي قص حاد حوالين الشخص.","en":"Unlike Magic Mask, the map is gradual. That makes it great for fog and blur since it avoids a hard cutout around the subject."}},{"name":{"ar":"Node ين: خريطة وتأثير","en":"Two nodes: map and effect"},"desc":{"ar":"الطريقة المرتبة: Node فيه Depth Map، ووصّل الـ key output حقه للـ Node الثاني اللي فيه Lens Blur أو التلوين.","en":"The clean setup: one node holds the Depth Map, and its key output feeds a second node that holds the Lens Blur or grade."}}],"steps":[{"ar":"اعمل Node جديد وحط عليه Depth Map من Resolve FX. فعّل Depth Map Preview عشان تشوف الخريطة.","en":"Add a new node and drop Depth Map on it from Resolve FX. Enable Depth Map Preview to see the map."},{"ar":"حرّك Near Limit و Far Limit لحد ما يصير الشخص أبيض والخلفية تتدرج للأسود. اقلب الخريطة لو تبغى تأثر على الخلفية.","en":"Adjust Near Limit and Far Limit until the subject is white and the background fades to black. Invert the map if you want to affect the background."},{"ar":"طفّي Preview، واعمل Node ثاني ووصّل له الـ key output من Node الـ Depth Map.","en":"Turn off Preview, add a second node and connect the Depth Map node's key output to its key input."},{"ar":"لعمق الميدان: حط Lens Blur على الـ Node الثاني وزوّد بالراحة. للضباب أو الغبار: ارفع Lift وقلل Contrast وحط لون دافي أو رمادي.","en":"For depth of field: add Lens Blur to the second node and raise it gently. For fog or dust: lift the blacks, drop contrast and tint it warm or grey."},{"ar":"شغّل اللقطة وشوف لو الخريطة ترجف. لو فيه رجفة نعّمها من إعدادات Finesse في Depth Map.","en":"Play the shot and watch for a flickering map. If it flickers, smooth it with the Finesse settings in Depth Map."}],"quests":{"train":{"ar":"خذ لقطة واسعة فيها شخص قريب وخلفية بعيدة. اعمل منها ٣ نسخ: تغبيش خلفية، ضباب صباحي، وغبار دافي. احفظ كل وحدة Still عشان تقارن.","en":"Take a wide shot with a close subject and a far background. Make 3 versions: background blur, morning haze, and warm dust. Grab a still of each to compare."},"research":{"ar":"قارن ٣ شروحات من تحت. اكتب في Obsidian: متى فضّلوا Depth Map على Magic Mask، وإيش أرقام Near و Far اللي استخدموها.","en":"Compare 3 tutorials below. Note in Obsidian when they preferred Depth Map over Magic Mask, and what Near/Far values they used."},"produce":{"ar":"ريل ١٥ ثانية \"عملت جو غبار بدون ما يطلع غبار\". الثانية الأولى اللقطة صافية، وبعدها الغبار يزحف من البعيد للقريب بالتدريج. اختم بقبل وبعد.","en":"15 s reel: \"Made a dusty-day look without any dust.\" Open on a clear shot, then the haze creeps from far to near. End with a before/after."},"article":{"ar":"\"Depth Map في DaVinci Resolve: عمق ميدان وضباب بدون عدسة غالية\": ١) إيش هي خريطة العمق ٢) Near و Far Limit ٣) ربط الـ Node ين ٤) عمق ميدان بـ Lens Blur ٥) ضباب وغبار ٦) Depth Map ولا Magic Mask؟","en":"\"Depth Map in DaVinci Resolve: depth of field and haze without a pricey lens\": 1) What a depth map is 2) Near and Far Limit 3) Linking the two nodes 4) DOF with Lens Blur 5) Fog and dust 6) Depth Map or Magic Mask?"}},"trend":{"ar":"كثير من الملونين في الريلز يقولوا \"استخدم Depth Map بدل Magic Mask\" للخلفيات، لأن الانتقال أنعم ويطلع سينمائي أكثر.","en":"Many colorists on reels now say \"use Depth Map instead of Magic Mask\" for backgrounds, because the falloff is softer and more cinematic."},"refs":[["yt","youtube.com","How to use Depth Map in DaVinci Resolve Studio | Tutorial","https://www.youtube.com/watch?v=qHtjxyu_Jsk"],["yt","youtube.com","DaVinci Resolve AI Depth Map in 3 Minutes","https://www.youtube.com/watch?v=FcBa6WiAw0o"],["yt","youtube.com","How to use the brand new DEPTH MAP tool in Davinci Resolve 18 Studio! Full Overview & Tutorial","https://www.youtube.com/watch?v=b2fwxkZfga8"],["tt","@dawiet_cc","How to use the depth map in davinci resolve fast and easy (background blur)","https://www.tiktok.com/@dawiet_cc/video/7365536180189842721"],["tt","@colorspacelost","Depth Map instead of Magic Mask (two-node workflow)","https://www.tiktok.com/@colorspacelost/video/7507362410798320918"],["tt","@dawiet_cc","You can do a lot of cool things with the depth map in davinci resolve","https://www.tiktok.com/@dawiet_cc/video/7467256872718847254"],["tt","@martinvelardep","Efecto Depth Map","https://www.tiktok.com/@martinvelardep/video/7213152778246638854"],["ig","instagram.com","Use the Depth Map effect instead of the Magic Mask","https://www.instagram.com/reel/DPbYy3xjQPg/"],["ig","@jishad_muhammed","The depth map is a great ... (reposted with more examples)","https://www.instagram.com/p/Ct_H_YXx6W6/"],["web","mixinglight.com","Digging Into The Depth Map - One of Resolve 18's Best New Features","https://mixinglight.com/color-grading-tutorials/use-depth-map-resolve-18/"],["web","filmeditingpro.com","Depth Map and Surface Tracker - DaVinci Resolve 18 Tutorial","https://www.filmeditingpro.com/depth-map-and-surface-tracker-davinci-resolve-18-tutorial/"]],"arGap":{"has":true,"ar":"ما لقيت شرح عربي لـ Depth Map في الدافنشي. فكرة \"جو غبار\" بالعربي ممكن تكون أول شرح من نوعه.","en":"No Arabic tutorial on Depth Map in Resolve turned up. An Arabic \"dusty-day look\" video could be the first of its kind."},"set":"studio"},{"id":"face-refinement","page":"color","ar":"Face Refinement: تنعيم الوجه بالذكاء الاصطناعي","en":"Face Refinement: AI face retouch","tier":2,"studio":true,"related":{"ar":"يكمّل كرت درجات البشرة بالـ Qualifier، بس هنا الشغل على ملامح الوجه نفسها.","en":"Pairs with the Qualifier skin tones card, but here you work on the face features themselves."},"what":{"ar":"Face Refinement هو Resolve FX في صفحة Color. يلقط الوجه ويتتبعه لوحده، وبعدين تقدر تنعّم البشرة، تفتّح العيون، تخفف الهالات، وتعدّل لون الشفايف. مثالي لفيديوهات التوك هيد.","en":"Face Refinement is a Resolve FX on the Color page. It finds and tracks the face on its own, then lets you smooth skin, brighten eyes, reduce dark circles and tweak lip color. Perfect for talking-head videos."},"ideasTitle":{"ar":"٣ أشياء لازم تعرفها","en":"3 things to know"},"ideas":[{"name":{"ar":"الـ Analyze أول حاجة","en":"Analyze comes first"},"desc":{"ar":"الأداة ما تشتغل لحد ما تضغط Analyze عشان تتتبع الوجه. لو الوجه طلع من الكادر أو انلف كثير، راجع التتبع قبل ما تكمل.","en":"The tool does nothing until you press Analyze to track the face. If the face leaves frame or turns a lot, check the track before moving on."}},{"name":{"ar":"الأقل أحلى","en":"Less is more"},"desc":{"ar":"تنعيم البشرة الزايد يخلي الوجه شكله بلاستيك. خلي ملمس البشرة باين، وقارن قبل وبعد دايماً.","en":"Too much smoothing makes the face look plastic. Keep some skin texture and always compare before and after."}},{"name":{"ar":"نود لحاله","en":"Its own node"},"desc":{"ar":"حط Face Refinement في نود لحاله بعد التصحيح الأساسي، عشان تقدر تطفيه وتشغله وتخفف قوته بسهولة.","en":"Put Face Refinement on its own node after your base correction so you can toggle it and dial it back easily."}}],"steps":[{"ar":"في صفحة Color، اعمل نود جديد بعد نود التصحيح الأساسي (Alt+S).","en":"On the Color page, add a new serial node after your base correction (Alt+S)."},{"ar":"من Effects دور على Face Refinement واسحبه على النود.","en":"In Effects, find Face Refinement and drag it onto the node."},{"ar":"اضغط Analyze وخليه يتتبع الوجه على طول الكليب. شغّل Show Overlay عشان تتأكد إن التتبع مضبوط.","en":"Press Analyze to track the face across the clip. Turn on Show Overlay to confirm the track is right."},{"ar":"ابدأ بـ Texture Refinement وخفف التنعيم شوي شوي لحد ما البشرة تنظف بس الملمس يبقى.","en":"Start with Texture Refinement and raise smoothing slowly until skin looks clean but texture stays."},{"ar":"بعدين اشتغل على Eye Retouching (تفتيح العين والهالات) و Lip Retouching بلمسات خفيفة.","en":"Then use Eye Retouching (brighten eyes, dark circles) and Lip Retouching with a light touch."},{"ar":"اطفي وشغّل النود (Ctrl+D) وقارن. لو زاد، نزّل Key Output Gain أو قوة التأثير.","en":"Toggle the node (Ctrl+D) to compare. If it is too much, lower Key Output Gain or the effect strength."}],"quests":{"train":{"ar":"خذ كليب توك هيد لك بإضاءة عادية، واعمل ٣ نسخ: تنعيم خفيف، متوسط، قوي. اختار الأكثر طبيعية منهم واكتب ليه.","en":"Take one of your own talking-head clips and make 3 versions: light, medium and heavy smoothing. Pick the most natural one and write why."},"research":{"ar":"شوف ٣ من المراجع تحت وقارن الإعدادات اللي استخدموها. سجّل في Obsidian الأرقام اللي تحس إنها طبيعية لبشرة سعودية/خليجية.","en":"Watch 3 of the refs below and compare their settings. Note in Obsidian the values that feel natural for Saudi/Gulf skin tones."},"produce":{"ar":"ريل ٢٠ ثانية \"قبل وبعد\": أول ثانيتين سبليت سكرين ووجهك قبل وبعد مع نص \"نفس الكاميرا، بدون فلتر\". بعدها ٣ لقطات سريعة للإعدادات.","en":"A 20 s before/after reel: first 2 seconds are a split screen of your face with the text \"Same camera, no filter\". Then 3 quick shots of the settings."},"article":{"ar":"عنوان: \"مكياج رقمي طبيعي في دافنشي\". النقاط: إيش هو Face Refinement، خطوات التتبع، الإعدادات الآمنة، أخطاء تخلي الوجه بلاستيك، قبل وبعد.","en":"Title: \"Natural digital makeup in DaVinci\". Outline: what Face Refinement is, tracking steps, safe settings, mistakes that make faces plastic, before/after."}},"trend":{"ar":"صناع المحتوى يستخدمونه للمسة \"نظيف بس طبيعي\" بدل فلاتر الجوال القوية. التريند دحين هو التنعيم اللي ما ينلاحظ.","en":"Creators use it for a \"clean but natural\" look instead of heavy phone filters. The trend now is retouching you cannot notice."},"refs":[["yt","youtube.com","Face Refinement Reloaded | DaVinci Resolve 19 Tutorial","https://www.youtube.com/watch?v=SrJvrcD6liI"],["yt","youtube.com","DaVinci Resolve Face Refinement for SMOOTH Skin & PERFECT Lighting","https://www.youtube.com/watch?v=BBnfL0ZVdjM"],["yt","youtube.com","Face Refinement in Davinci Resolve Tutorial","https://www.youtube.com/watch?v=gMuy5dv3XC4"],["yt","youtube.com","تنعيم البشرة في الفيديو ببرنامج دافنشي ريسولف | Face refinement Davinci Resolve","https://www.youtube.com/watch?v=oTI1JoLzFgE"],["tt","@wbynan","Face Refinement Techniques in DaVinci Resolve 20","https://www.tiktok.com/@wbynan/video/7518782562374880542"],["tt","@chromaneer","Face Refinement OFX inside of DaVinci Resolve 18.5","https://www.tiktok.com/@chromaneer/video/7231671658610724102"],["tt","@creatorsergeant","How to smoothen out your skins with the face refinement tool in DaVinci Resolve","https://www.tiktok.com/@creatorsergeant/video/7389706123957275910"],["tt","@chrisbo.mov","Have you tried using the Face Refinement effect in DaVinci Resolve?","https://www.tiktok.com/@chrisbo.mov/video/7517742585293606166"],["ig","instagram.com","How To Use The FACE REFINEMENT tool in Davinci Resolve!","https://www.instagram.com/reel/C7R6dVHJRE9/"],["ig","RESOLVED","Face Refinement in DaVinci Resolve","https://www.instagram.com/reel/DLNOIJARh_i/"],["ig","instagram.com","Skin refinement in DaVinci Resolve","https://www.instagram.com/reel/DIRR4xJpIKy/"],["web","toolfarm.com","Face Refinement Tool in DaVinci Resolve Studio 19","https://www.toolfarm.com/tutorial/face-refinement-davinci-resolve-studio/"]],"arGap":{"has":false,"ar":"فيه شرح عربي على يوتيوب لتنعيم البشرة بـ Face Refinement، بس المحتوى العربي قليل ومعظمه قديم. فرصة تعمل نسخة أحدث على Resolve 20 باللهجة السعودية.","en":"There is an Arabic YouTube tutorial on Face Refinement skin smoothing, but Arabic content is thin and mostly older. Room for a fresh Resolve 20 version in Saudi dialect."},"set":"studio"},{"id":"music-remixer","page":"fair","ar":"Music Remixer: فصل الأغنية لطبقات","en":"Music Remixer: split a song into stems","tier":1,"studio":true,"related function drawVisits(){

   <path d="${step} L${x(last)},${y(0)} L${x(0)},${y(0)} Z" fill="#5ee39a" fill-opacity=".14"/>
   <path d="${step}" fill="none" stroke="#5ee39a" stroke-width="3"/>
   <rect x="${x(last)-5}" y="${y(VIS[last])-5}" width="10" height="10" fill="#ffcc4d" stroke="#070c12" stroke-width="2"/>
   <g id="hov" visibility="hidden"><line id="hl" y1="${m.t}" y2="${H-m.b}" stroke="#f6f1e3" stroke-dasharray="3 3"/><rect id="hc" width="10" height="10" fill="#5ee39a" stroke="#070c12" stroke-width="2"/></g>
   <rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;

}
